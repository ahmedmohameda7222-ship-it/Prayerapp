name: Adhan hash probe

on:
  pull_request:
    branches:
      - recovery/android-v2
    paths:
      - '.github/workflows/adhan-hash-probe.yml'
      - 'android-twa/app/src/test/java/de/donaumoschee/app/adhan/AdhanHashProbeTest.java'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trace broken Fajr Madinah catalog exposure
        shell: bash
        run: |
          set -euo pipefail
          echo 'FAJR_MADINAH_REFERENCES_BEGIN'
          grep -RIn --exclude-dir=.git --exclude='*.map' 'fajr-madinah\|19\.mp3' . || true
          echo 'FAJR_MADINAH_REFERENCES_END'
