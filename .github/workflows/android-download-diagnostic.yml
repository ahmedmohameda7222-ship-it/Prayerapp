name: Android download diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/android-download-diagnostic.yml"

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  ORIGIN: https://donaumoschee.vercel.app
  TAG: android-v1.0.1
  ASSET: danube-mosque.apk

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read version-matched Next.js route handler docs
        shell: bash
        run: |
          set -euo pipefail
          node -e "console.log('Next version:', require('next/package.json').version)"
          echo 'Candidate docs:'
          find node_modules/next/dist/docs -type f | grep -Ei 'route|redirect' | head -n 60
          doc="$(find node_modules/next/dist/docs -type f | grep -Ei 'route-handler|route_handlers|route-handlers' | head -n 1 || true)"
          test -n "$doc"
          echo "DOC=$doc"
          grep -n -E 'Response|redirect|headers|Route Handler|NextResponse' "$doc" | head -n 160 || true

      - name: Inspect release metadata and both download paths
        shell: bash
        run: |
          set -u
          echo '=== GitHub release ==='
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,targetCommitish,assets --jq '{tagName,isDraft,isPrerelease,targetCommitish,assets:[.assets[]|{name,size,digest,url}]}' || true
          rm -rf /tmp/release-meta && mkdir -p /tmp/release-meta
          gh release download "$TAG" --pattern android-release.json --dir /tmp/release-meta || true
          echo '=== Published android-release.json ==='
          cat /tmp/release-meta/android-release.json || true
          echo

          echo '=== Production release API ==='
          curl -sS -D /tmp/api.headers -o /tmp/api.body "$ORIGIN/api/android/release" || true
          cat /tmp/api.headers || true
          echo 'BODY:'
          cat /tmp/api.body || true
          echo

          echo '=== Production download route (no redirects) ==='
          curl -sS -D /tmp/route.headers -o /tmp/route.body --max-redirs 0 "$ORIGIN/download/android" || true
          cat /tmp/route.headers || true
          route_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/route.headers)"
          echo "route-location=$route_location"

          echo '=== Direct GitHub release asset ==='
          direct="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          curl -sS -L -D /tmp/direct.headers -o /tmp/direct.apk -w '\nfinal_url=%{url_effective}\nhttp=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\n' "$direct" || true
          ls -l /tmp/direct.apk || true
          file /tmp/direct.apk || true
          sha256sum /tmp/direct.apk || true
          unzip -t /tmp/direct.apk >/dev/null 2>&1; echo "direct_unzip_exit=$?"

          echo '=== Website route with redirects ==='
          curl -sS -L -D /tmp/site.headers -o /tmp/site.apk -w '\nfinal_url=%{url_effective}\nhttp=%{http_code}\ncontent_type=%{content_type}\nsize_download=%{size_download}\n' "$ORIGIN/download/android" || true
          ls -l /tmp/site.apk || true
          file /tmp/site.apk || true
          sha256sum /tmp/site.apk || true
          unzip -t /tmp/site.apk >/dev/null 2>&1; echo "site_unzip_exit=$?"

          echo '=== Key response headers ==='
          echo '-- route --'
          grep -Ei '^(HTTP/|location:|content-type:|content-disposition:|content-length:)' /tmp/route.headers || true
          echo '-- direct final --'
          grep -Ei '^(HTTP/|location:|content-type:|content-disposition:|content-length:)' /tmp/direct.headers || true
          echo '-- site final --'
          grep -Ei '^(HTTP/|location:|content-type:|content-disposition:|content-length:)' /tmp/site.headers || true

          exit 0
