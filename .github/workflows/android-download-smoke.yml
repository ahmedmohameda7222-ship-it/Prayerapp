name: Android public download smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-download-smoke.yml"
      - "android-twa/twa-manifest.json"
      - "app/download/android/**"
      - "app/api/android/release/**"
      - "lib/android-release.ts"

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  PRODUCTION_ORIGIN: https://donaumoschee.vercel.app

jobs:
  verify:
    name: Verify live APK download path
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify production release and live download
        id: live
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(jq -r '.versionName' android-twa/twa-manifest.json)"
          version_code="$(jq -r '.versionCode' android-twa/twa-manifest.json)"
          package_id="$(jq -r '.packageId' android-twa/twa-manifest.json)"
          tag="android-v${version_name}"
          test "$package_id" = "de.donaumoschee.app"
          gh release view "$tag" --json tagName,isDraft,isPrerelease,assets \
            --jq '.tagName == "'"$tag"'" and .isDraft == false and .isPrerelease == false and ([.assets[].name] | index("danube-mosque.apk") != null) and ([.assets[].name] | index("android-release.json") != null)' \
            | grep -qx true

          ready=false
          for attempt in $(seq 1 48); do
            code="$(curl -sS -o /tmp/android-release.json -w '%{http_code}' "$PRODUCTION_ORIGIN/api/android/release" || true)"
            if [ "$code" = "200" ] && jq -e \
              --arg packageId "$package_id" \
              --arg versionName "$version_name" \
              --argjson versionCode "$version_code" \
              '.packageId == $packageId and .versionName == $versionName and .versionCode == $versionCode and .apkAsset == "danube-mosque.apk" and (.apkSha256 | type == "string" and length == 64)' \
              /tmp/android-release.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true

          response_code="$(curl -sS -D /tmp/download-headers -o /dev/null --max-redirs 0 -w '%{http_code}' "$PRODUCTION_ORIGIN/download/android")"
          case "$response_code" in
            301|302|303|307|308) ;;
            *) echo "Unexpected download status: $response_code" >&2; exit 1 ;;
          esac
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/download-headers)"
          test -n "$location"
          printf '%s' "$location" | grep -F "/releases/download/$tag/danube-mosque.apk" >/dev/null

          curl -fsSL "$location" -o /tmp/danube-mosque.apk
          test "$(stat -c%s /tmp/danube-mosque.apk)" -gt 1000000
          expected_sha="$(jq -r '.apkSha256' /tmp/android-release.json)"
          printf '%s  %s\n' "$expected_sha" /tmp/danube-mosque.apk | sha256sum --check --status
          unzip -t /tmp/danube-mosque.apk >/dev/null

      - name: Publish observable commit status
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state=success
            description="Production Download serves the verified Android APK"
          else
            state=failure
            description="Production Android Download smoke check failed"
          fi
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -n --arg state "$state" --arg description "$description" '{state:$state,context:"Android Download Live",description:$description}')" \
            >/dev/null
          test "$state" = success
