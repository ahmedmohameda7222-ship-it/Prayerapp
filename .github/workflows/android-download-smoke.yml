name: Android public download smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-download-smoke.yml"
      - "android-twa/twa-manifest.json"
      - "app/download/android/**"
      - "app/api/android/release/**"
      - "lib/android-release.ts"
      - ".github/workflows/android-production-release.yml"

permissions:
  contents: read
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  PRODUCTION_ORIGIN: https://donaumoschee.vercel.app
  DOWNLOAD_PATH: /download/android/danube-mosque.apk
  EXPECTED_CERT_SHA256: E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92

jobs:
  verify:
    name: Verify live APK download path
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify production release and live download
        id: live
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(jq -r '.versionName' android-twa/twa-manifest.json)"
          version_code="$(jq -r '.versionCode' android-twa/twa-manifest.json)"
          package_id="$(jq -r '.packageId' android-twa/twa-manifest.json)"
          target_sdk="$(jq -r '.targetSdkVersion' android-twa/twa-manifest.json)"
          tag="android-v${version_name}"
          test "$package_id" = "de.donaumoschee.app"
          test "$target_sdk" = "36"

          gh release view "$tag" --json tagName,isDraft,isPrerelease,assets \
            --jq '.tagName == "'"$tag"'" and .isDraft == false and .isPrerelease == false and ([.assets[].name] | index("danube-mosque.apk") != null) and ([.assets[].name] | index("android-release.json") != null)' \
            | grep -qx true

          rm -rf /tmp/release && mkdir -p /tmp/release
          gh release download "$tag" --pattern android-release.json --dir /tmp/release
          jq -e \
            --arg packageId "$package_id" \
            --arg versionName "$version_name" \
            --argjson versionCode "$version_code" \
            '.packageId == $packageId and .versionName == $versionName and .versionCode == $versionCode and .apkAsset == "danube-mosque.apk" and (.apkSha256 | type == "string" and length == 64) and (.certificateSha256 | type == "string" and length > 0)' \
            /tmp/release/android-release.json >/dev/null
          expected_sha="$(jq -r '.apkSha256' /tmp/release/android-release.json)"
          metadata_cert="$(jq -r '.certificateSha256' /tmp/release/android-release.json | tr '[:lower:]' '[:upper:]')"
          test "$metadata_cert" = "$EXPECTED_CERT_SHA256"

          ready=false
          for attempt in $(seq 1 48); do
            code="$(curl -sS -o /tmp/public-release.json -w '%{http_code}' "$PRODUCTION_ORIGIN/api/android/release" || true)"
            if [ "$code" = "200" ] && jq -e \
              --arg packageId "$package_id" \
              --arg versionName "$version_name" \
              --argjson versionCode "$version_code" \
              --arg downloadUrl "$DOWNLOAD_PATH" \
              '.packageId == $packageId and .versionName == $versionName and .versionCode == $versionCode and .downloadUrl == $downloadUrl and (.minimumSupportedVersionCode | type == "number") and (.publishedAt | type == "string")' \
              /tmp/public-release.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true

          response_code="$(curl -sS -D /tmp/download-headers -o /dev/null --max-redirs 0 -w '%{http_code}' "$PRODUCTION_ORIGIN$DOWNLOAD_PATH")"
          test "$response_code" = "307"
          grep -Eqi '^content-type:[[:space:]]*application/vnd\.android\.package-archive' /tmp/download-headers
          grep -Eqi '^content-disposition:[[:space:]]*attachment;[[:space:]]*filename="danube-mosque\.apk"' /tmp/download-headers
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/download-headers)"
          test -n "$location"
          printf '%s' "$location" | grep -F "/releases/download/$tag/danube-mosque.apk" >/dev/null

          legacy_code="$(curl -sS -D /tmp/legacy-headers -o /dev/null --max-redirs 0 -w '%{http_code}' "$PRODUCTION_ORIGIN/download/android")"
          test "$legacy_code" = "307"
          legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/legacy-headers)"
          printf '%s' "$legacy_location" | grep -F "$DOWNLOAD_PATH" >/dev/null

          curl -fsSL "$PRODUCTION_ORIGIN$DOWNLOAD_PATH" -o /tmp/danube-mosque.apk
          test "$(stat -c%s /tmp/danube-mosque.apk)" -gt 1000000
          printf '%s  %s\n' "$expected_sha" /tmp/danube-mosque.apk | sha256sum --check --status
          unzip -t /tmp/danube-mosque.apk >/dev/null

          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs /tmp/danube-mosque.apk)"
          actual_cert="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          test "$actual_cert" = "$metadata_cert"

          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging /tmp/danube-mosque.apk)"
          printf '%s\n' "$badging" | grep -F "package: name='$package_id' versionCode='$version_code' versionName='$version_name'"
          printf '%s\n' "$badging" | grep -F "targetSdkVersion:'$target_sdk'"
          ! printf '%s\n' "$badging" | grep -F "$package_id.debug"

      - name: Publish observable commit status
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state=success
            description="Production Download serves the verified Android APK"
          else
            state=failure
            description="Production Android Download smoke check failed"
          fi
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -n --arg state "$state" --arg description "$description" '{state:$state,context:"Android Download Live",description:$description}')" \
            >/dev/null
          test "$state" = success
