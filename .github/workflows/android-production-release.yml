name: Android production release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android TWA workflow run on the current main commit
        required: true
        type: string
      tag:
        description: Production Android tag matching android-v<manifest versionName>
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_ANDROID_PRODUCTION to authorize the public tag and release
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  EXPECTED_CERT_SHA256: E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    name: Verify and publish approved Android production artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: android-production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require trusted current-main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

      - name: Derive and validate Android release metadata
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          package_id="$(jq -r ".packageId" android-twa/twa-manifest.json)"
          version_code="$(jq -r ".versionCode" android-twa/twa-manifest.json)"
          version_name="$(jq -r ".versionName" android-twa/twa-manifest.json)"
          minimum_supported_version_code="$(jq -r ".minimumSupportedVersionCode" android-twa/twa-manifest.json)"
          compile_sdk="$(jq -r ".compileSdkVersion" android-twa/twa-manifest.json)"
          target_sdk="$(jq -r ".targetSdkVersion" android-twa/twa-manifest.json)"
          min_sdk="$(jq -r ".minSdkVersion" android-twa/twa-manifest.json)"
          test "$package_id" = "de.donaumoschee.app"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$minimum_supported_version_code" =~ ^[1-9][0-9]*$ ]]
          test "$minimum_supported_version_code" -le "$version_code"
          test "$compile_sdk" = "37"
          test "$target_sdk" = "37"
          test "$min_sdk" = "23"
          test '${{ inputs.confirmation }}' = 'PUBLISH_ANDROID_PRODUCTION'
          test "${{ inputs.tag }}" = "android-v$version_name"
          {
            printf 'package_id=%s\n' "$package_id"
            printf 'version_code=%s\n' "$version_code"
            printf 'version_name=%s\n' "$version_name"
            printf 'minimum_supported_version_code=%s\n' "$minimum_supported_version_code"
            printf 'compile_sdk=%s\n' "$compile_sdk"
            printf 'target_sdk=%s\n' "$target_sdk"
            printf 'min_sdk=%s\n' "$min_sdk"
          } >> "$GITHUB_OUTPUT"

      - name: Verify source workflow is green on current main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.run_id }}")"
          conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          head_branch="$(printf '%s' "$run_json" | jq -r '.head_branch')"
          head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha')"
          workflow_name="$(printf '%s' "$run_json" | jq -r '.name')"
          test "$conclusion" = "success"
          test "$head_branch" = "main"
          test "$workflow_name" = "Android TWA"
          test "$head_sha" = "$GITHUB_SHA"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install verification tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Enforce monotonic versionCode against latest Android release
        shell: bash
        env:
          VERSION_CODE: ${{ steps.manifest.outputs.version_code }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName,publishedAt --jq '[.[] | select(.tagName | test("^android-v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.publishedAt) | last | .tagName // empty')"
          if [ -n "$latest_tag" ]; then
            mkdir previous-release
            gh release download "$latest_tag" --pattern danube-mosque.apk --dir previous-release
            previous_badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging previous-release/danube-mosque.apk)"
            previous_version_code="$(printf '%s\n' "$previous_badging" | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
            [[ "$previous_version_code" =~ ^[1-9][0-9]*$ ]]
            test "$VERSION_CODE" -gt "$previous_version_code"
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Reconstruct and verify permanent signing certificate
        working-directory: android-twa
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test "$ANDROID_KEY_ALIAS" = "danube-mosque-release"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/danube-mosque-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          certificate="$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          actual="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > signing.properties
          chmod 600 signing.properties

      - name: Test, lint, and build production APK and AAB
        working-directory: android-twa
        run: ./gradlew --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare exact production assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          cp android-twa/app/build/outputs/apk/release/app-release.apk candidate/danube-mosque.apk
          cp android-twa/app/build/outputs/bundle/release/app-release.aab candidate/danube-mosque.aab
          (cd candidate && sha256sum danube-mosque.apk danube-mosque.aab > SHA256SUMS.txt)

      - name: Independently verify production artifacts
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.manifest.outputs.package_id }}
          VERSION_CODE: ${{ steps.manifest.outputs.version_code }}
          VERSION_NAME: ${{ steps.manifest.outputs.version_name }}
          TARGET_SDK: ${{ steps.manifest.outputs.target_sdk }}
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check SHA256SUMS.txt
          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs danube-mosque.apk)"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging danube-mosque.apk)"
          printf '%s\n' "$badging" | grep -F "package: name='$PACKAGE_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          printf '%s\n' "$badging" | grep -F "sdkVersion:'23'"
          printf '%s\n' "$badging" | grep -F "targetSdkVersion:'$TARGET_SDK'"
          jarsigner -verify -verbose -certs danube-mosque.aab
          aab_certificate="$(keytool -printcert -jarfile danube-mosque.aab)"
          aab_actual="$(printf '%s\n' "$aab_certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$aab_actual" = "$EXPECTED_CERT_SHA256"

      - name: Create and verify machine-readable release metadata
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.manifest.outputs.package_id }}
          VERSION_CODE: ${{ steps.manifest.outputs.version_code }}
          VERSION_NAME: ${{ steps.manifest.outputs.version_name }}
          MINIMUM_SUPPORTED_VERSION_CODE: ${{ steps.manifest.outputs.minimum_supported_version_code }}
        run: |
          set -euo pipefail
          apk_sha256="$(sha256sum candidate/danube-mosque.apk | awk '{print $1}')"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg packageId "$PACKAGE_ID" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --argjson minimumSupportedVersionCode "$MINIMUM_SUPPORTED_VERSION_CODE" \
            --arg publishedAt "$published_at" \
            --arg apkAsset "danube-mosque.apk" \
            --arg apkSha256 "$apk_sha256" \
            --arg certificateSha256 "$EXPECTED_CERT_SHA256" \
            '{
              packageId: $packageId,
              versionCode: $versionCode,
              versionName: $versionName,
              minimumSupportedVersionCode: $minimumSupportedVersionCode,
              publishedAt: $publishedAt,
              apkAsset: $apkAsset,
              apkSha256: $apkSha256,
              certificateSha256: $certificateSha256
            }' \
            > candidate/android-release.json
          jq -e \
            --arg packageId "$PACKAGE_ID" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --argjson minimumSupportedVersionCode "$MINIMUM_SUPPORTED_VERSION_CODE" \
            --arg apkSha256 "$apk_sha256" \
            --arg certificateSha256 "$EXPECTED_CERT_SHA256" \
            '.packageId == $packageId and .versionCode == $versionCode and .versionName == $versionName and .minimumSupportedVersionCode == $minimumSupportedVersionCode and .apkAsset == "danube-mosque.apk" and .apkSha256 == $apkSha256 and .certificateSha256 == $certificateSha256' \
            candidate/android-release.json >/dev/null
          (cd candidate && sha256sum android-release.json >> SHA256SUMS.txt)

      - name: Remove reconstructed signing material
        if: always()
        shell: bash
        run: rm -f android-twa/signing.properties "$RUNNER_TEMP/danube-mosque-release.jks"

      - name: Create public production tag and release
        shell: bash
        run: |
          set -euo pipefail
          ! gh release view '${{ inputs.tag }}' >/dev/null 2>&1
          gh release create '${{ inputs.tag }}' \
            candidate/danube-mosque.apk \
            candidate/danube-mosque.aab \
            candidate/SHA256SUMS.txt \
            candidate/android-release.json \
            --target '${{ steps.source.outputs.head_sha }}' \
            --title 'Danube Mosque Android ${{ steps.manifest.outputs.version_name }}' \
            --notes 'Production Android package ${{ steps.manifest.outputs.package_id }}. APK and Play Store AAB are signed by the permanent production certificate.'