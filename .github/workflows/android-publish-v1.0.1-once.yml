name: Publish Android 1.0.1 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  EXPECTED_CERT_SHA256: E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    name: Verify, sign, and publish Android 1.0.1
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact current main and exact release identity
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          package_id="$(jq -r '.packageId' android-twa/twa-manifest.json)"
          version_code="$(jq -r '.versionCode' android-twa/twa-manifest.json)"
          version_name="$(jq -r '.versionName' android-twa/twa-manifest.json)"
          minimum_supported_version_code="$(jq -r '.minimumSupportedVersionCode' android-twa/twa-manifest.json)"
          target_sdk="$(jq -r '.targetSdkVersion' android-twa/twa-manifest.json)"
          test "$package_id" = "de.donaumoschee.app"
          test "$version_code" = "4"
          test "$version_name" = "1.0.1"
          [[ "$minimum_supported_version_code" =~ ^[1-9][0-9]*$ ]]
          test "$minimum_supported_version_code" -le "$version_code"
          test "$target_sdk" = "36"
          ! gh release view "android-v$version_name" >/dev/null 2>&1
          {
            printf 'package_id=%s\n' "$package_id"
            printf 'version_code=%s\n' "$version_code"
            printf 'version_name=%s\n' "$version_name"
            printf 'minimum_supported_version_code=%s\n' "$minimum_supported_version_code"
            printf 'target_sdk=%s\n' "$target_sdk"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify monotonic versionCode against Android 1.0.0
        shell: bash
        env:
          VERSION_CODE: ${{ steps.manifest.outputs.version_code }}
        run: |
          set -euo pipefail
          if gh release view android-v1.0.0 >/dev/null 2>&1; then
            mkdir previous-release
            gh release download android-v1.0.0 --pattern danube-mosque.apk --dir previous-release
            previous_badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging previous-release/danube-mosque.apk)"
            previous_version_code="$(printf '%s\n' "$previous_badging" | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
            [[ "$previous_version_code" =~ ^[1-9][0-9]*$ ]]
            test "$VERSION_CODE" -gt "$previous_version_code"
          fi

      - name: Reconstruct and verify permanent signing certificate
        working-directory: android-twa
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test "$ANDROID_KEY_ALIAS" = "danube-mosque-release"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/danube-mosque-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          certificate="$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          actual="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > signing.properties
          chmod 600 signing.properties

      - name: Test, lint, and build signed production APK and AAB
        working-directory: android-twa
        run: ./gradlew --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare and independently verify production assets
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.manifest.outputs.package_id }}
          VERSION_CODE: ${{ steps.manifest.outputs.version_code }}
          VERSION_NAME: ${{ steps.manifest.outputs.version_name }}
          MINIMUM_SUPPORTED_VERSION_CODE: ${{ steps.manifest.outputs.minimum_supported_version_code }}
          TARGET_SDK: ${{ steps.manifest.outputs.target_sdk }}
        run: |
          set -euo pipefail
          mkdir candidate
          cp android-twa/app/build/outputs/apk/release/app-release.apk candidate/danube-mosque.apk
          cp android-twa/app/build/outputs/bundle/release/app-release.aab candidate/danube-mosque.aab
          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs candidate/danube-mosque.apk)"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging candidate/danube-mosque.apk)"
          printf '%s\n' "$badging" | grep -F "package: name='$PACKAGE_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          printf '%s\n' "$badging" | grep -F "targetSdkVersion:'$TARGET_SDK'"
          jarsigner -verify -verbose -certs candidate/danube-mosque.aab >/dev/null
          aab_certificate="$(keytool -printcert -jarfile candidate/danube-mosque.aab)"
          aab_actual="$(printf '%s\n' "$aab_certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$aab_actual" = "$EXPECTED_CERT_SHA256"
          apk_sha256="$(sha256sum candidate/danube-mosque.apk | awk '{print $1}')"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg packageId "$PACKAGE_ID" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --argjson minimumSupportedVersionCode "$MINIMUM_SUPPORTED_VERSION_CODE" \
            --arg publishedAt "$published_at" \
            --arg apkAsset "danube-mosque.apk" \
            --arg apkSha256 "$apk_sha256" \
            --arg certificateSha256 "$EXPECTED_CERT_SHA256" \
            '{packageId, versionCode, versionName, minimumSupportedVersionCode, publishedAt, apkAsset, apkSha256, certificateSha256}' \
            > candidate/android-release.json
          (cd candidate && sha256sum danube-mosque.apk danube-mosque.aab android-release.json > SHA256SUMS.txt)
          (cd candidate && sha256sum --check SHA256SUMS.txt)

      - name: Remove reconstructed signing material
        if: always()
        shell: bash
        run: rm -f android-twa/signing.properties "$RUNNER_TEMP/danube-mosque-release.jks"

      - name: Publish Android 1.0.1 release
        shell: bash
        run: |
          set -euo pipefail
          gh release create android-v1.0.1 \
            candidate/danube-mosque.apk \
            candidate/danube-mosque.aab \
            candidate/SHA256SUMS.txt \
            candidate/android-release.json \
            --target "$GITHUB_SHA" \
            --title "Danube Mosque Android 1.0.1" \
            --notes "Production Android package de.donaumoschee.app, versionCode 4. Signed by the permanent production certificate."

      - name: Verify published release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-v1.0.1 --json tagName,isDraft,isPrerelease,targetCommitish,assets --jq '.tagName == "android-v1.0.1" and .isDraft == false and .isPrerelease == false and ([.assets[].name] | index("danube-mosque.apk") != null) and ([.assets[].name] | index("android-release.json") != null)'
