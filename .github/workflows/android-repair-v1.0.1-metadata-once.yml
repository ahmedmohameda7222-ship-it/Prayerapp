name: Repair Android 1.0.1 release metadata once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-repair-v1.0.1-metadata-once.yml"

permissions:
  contents: write
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: android-v1.0.1
  EXPECTED_PACKAGE_ID: de.donaumoschee.app
  EXPECTED_VERSION_CODE: "4"
  EXPECTED_VERSION_NAME: 1.0.1
  EXPECTED_TARGET_SDK: "36"
  EXPECTED_APK_SHA256: 00f040b6852b492bd258a4fcd1aff294905ccd67c5be41e7c78fe712415f529c
  EXPECTED_CERT_SHA256: E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92
  PRODUCTION_ORIGIN: https://donaumoschee.vercel.app
  DOWNLOAD_PATH: /download/android/danube-mosque.apk

jobs:
  repair:
    name: Verify immutable 1.0.1 assets, repair metadata, and verify live download
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact current main and expected manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          test "$(jq -r '.packageId' android-twa/twa-manifest.json)" = "$EXPECTED_PACKAGE_ID"
          test "$(jq -r '.versionCode' android-twa/twa-manifest.json)" = "$EXPECTED_VERSION_CODE"
          test "$(jq -r '.versionName' android-twa/twa-manifest.json)" = "$EXPECTED_VERSION_NAME"
          test "$(jq -r '.targetSdkVersion' android-twa/twa-manifest.json)" = "$EXPECTED_TARGET_SDK"

      - name: Download immutable published assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,publishedAt,assets)"
          test "$(printf '%s' "$release_json" | jq -r '.tagName')" = "$TAG"
          test "$(printf '%s' "$release_json" | jq -r '.isDraft')" = "false"
          test "$(printf '%s' "$release_json" | jq -r '.isPrerelease')" = "false"
          published_at="$(printf '%s' "$release_json" | jq -r '.publishedAt')"
          test -n "$published_at"
          apk_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "danube-mosque.apk") | .digest')"
          aab_digest="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name == "danube-mosque.aab") | .digest')"
          test "$apk_digest" = "sha256:$EXPECTED_APK_SHA256"
          [[ "$aab_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p candidate
          gh release download "$TAG" --pattern danube-mosque.apk --dir candidate
          gh release download "$TAG" --pattern danube-mosque.aab --dir candidate
          test "$(sha256sum candidate/danube-mosque.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "sha256:$(sha256sum candidate/danube-mosque.aab | awk '{print $1}')" = "$aab_digest"
          printf 'published_at=%s\n' "$published_at" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Independently verify existing APK and AAB identity
        shell: bash
        run: |
          set -euo pipefail
          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs candidate/danube-mosque.apk)"
          cert="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          test "$cert" = "$EXPECTED_CERT_SHA256"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging candidate/danube-mosque.apk)"
          printf '%s\n' "$badging" | grep -F "package: name='$EXPECTED_PACKAGE_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"
          printf '%s\n' "$badging" | grep -F "targetSdkVersion:'$EXPECTED_TARGET_SDK'"
          unzip -t candidate/danube-mosque.apk >/dev/null
          jarsigner -verify -verbose -certs candidate/danube-mosque.aab >/dev/null
          aab_certificate="$(keytool -printcert -jarfile candidate/danube-mosque.aab)"
          aab_cert="$(printf '%s\n' "$aab_certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$aab_cert" = "$EXPECTED_CERT_SHA256"

      - name: Generate corrected metadata and checksums
        shell: bash
        env:
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          set -euo pipefail
          minimum_supported_version_code="$(jq -r '.minimumSupportedVersionCode' android-twa/twa-manifest.json)"
          [[ "$minimum_supported_version_code" =~ ^[1-9][0-9]*$ ]]
          test "$minimum_supported_version_code" -le "$EXPECTED_VERSION_CODE"
          jq -n \
            --arg packageId "$EXPECTED_PACKAGE_ID" \
            --argjson versionCode "$EXPECTED_VERSION_CODE" \
            --arg versionName "$EXPECTED_VERSION_NAME" \
            --argjson minimumSupportedVersionCode "$minimum_supported_version_code" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg apkAsset "danube-mosque.apk" \
            --arg apkSha256 "$EXPECTED_APK_SHA256" \
            --arg certificateSha256 "$EXPECTED_CERT_SHA256" \
            '{
              packageId: $packageId,
              versionCode: $versionCode,
              versionName: $versionName,
              minimumSupportedVersionCode: $minimumSupportedVersionCode,
              publishedAt: $publishedAt,
              apkAsset: $apkAsset,
              apkSha256: $apkSha256,
              certificateSha256: $certificateSha256
            }' > candidate/android-release.json
          jq -e \
            --arg packageId "$EXPECTED_PACKAGE_ID" \
            --argjson versionCode "$EXPECTED_VERSION_CODE" \
            --arg versionName "$EXPECTED_VERSION_NAME" \
            --arg apkSha256 "$EXPECTED_APK_SHA256" \
            --arg certificateSha256 "$EXPECTED_CERT_SHA256" \
            '.packageId == $packageId and .versionCode == $versionCode and .versionName == $versionName and .apkAsset == "danube-mosque.apk" and .apkSha256 == $apkSha256 and .certificateSha256 == $certificateSha256 and (.minimumSupportedVersionCode | type == "number") and (.publishedAt | type == "string")' \
            candidate/android-release.json >/dev/null
          (cd candidate && sha256sum danube-mosque.apk danube-mosque.aab android-release.json > SHA256SUMS.txt)
          (cd candidate && sha256sum --check SHA256SUMS.txt)

      - name: Repair metadata assets without replacing APK, AAB, or tag
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" candidate/android-release.json candidate/SHA256SUMS.txt --clobber
          rm -rf verify-release && mkdir verify-release
          gh release download "$TAG" --pattern android-release.json --dir verify-release
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir verify-release
          cmp -s candidate/android-release.json verify-release/android-release.json
          cmp -s candidate/SHA256SUMS.txt verify-release/SHA256SUMS.txt

      - name: Wait for production deployment/cache and verify exact live download
        id: live
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 90); do
            code="$(curl -sS -o /tmp/public-release.json -w '%{http_code}' "$PRODUCTION_ORIGIN/api/android/release" || true)"
            if [ "$code" = "200" ] && jq -e \
              --arg packageId "$EXPECTED_PACKAGE_ID" \
              --arg versionName "$EXPECTED_VERSION_NAME" \
              --argjson versionCode "$EXPECTED_VERSION_CODE" \
              --arg downloadUrl "$DOWNLOAD_PATH" \
              '.packageId == $packageId and .versionName == $versionName and .versionCode == $versionCode and .downloadUrl == $downloadUrl' \
              /tmp/public-release.json >/dev/null 2>&1; then
              route_code="$(curl -sS -D /tmp/download-headers -o /dev/null --max-redirs 0 -w '%{http_code}' "$PRODUCTION_ORIGIN$DOWNLOAD_PATH" || true)"
              if [ "$route_code" = "307" ] \
                && grep -Eqi '^content-type:[[:space:]]*application/vnd\.android\.package-archive' /tmp/download-headers \
                && grep -Eqi '^content-disposition:[[:space:]]*attachment;[[:space:]]*filename="danube-mosque\.apk"' /tmp/download-headers; then
                location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/download-headers)"
                if printf '%s' "$location" | grep -F "/releases/download/$TAG/danube-mosque.apk" >/dev/null; then
                  ready=true
                  break
                fi
              fi
            fi
            sleep 10
          done
          test "$ready" = true
          curl -fsSL "$PRODUCTION_ORIGIN$DOWNLOAD_PATH" -o /tmp/live.apk
          test "$(stat -c%s /tmp/live.apk)" -gt 1000000
          test "$(sha256sum /tmp/live.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          unzip -t /tmp/live.apk >/dev/null

      - name: Publish final Android Download Live status
        if: always()
        shell: bash
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          if [ "$LIVE_OUTCOME" = "success" ]; then
            state=success
            description="Production Download serves verified Android 1.0.1 APK"
          else
            state=failure
            description="Android 1.0.1 metadata repair/live download verification failed"
          fi
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -n --arg state "$state" --arg description "$description" '{state:$state,context:"Android Download Live",description:$description}')" \
            >/dev/null
          test "$state" = success
