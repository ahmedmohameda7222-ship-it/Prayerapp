name: Android Signing Secret Smoke Test

on:
  push:
    branches:
      - "test/android-signing-secrets"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-signing-secret-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: $name is missing or empty"
              exit 1
            fi
          done

          keystore="${RUNNER_TEMP}/danube-mosque-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"

          keytool -list \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          fingerprint="$(keytool -list -v \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"

          expected="E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92"
          if [ "$fingerprint" != "$expected" ]; then
            echo "ERROR: certificate SHA-256 fingerprint does not match the expected production certificate"
            exit 1
          fi

          keytool -importkeystore \
            -srckeystore "$keystore" \
            -srcstoretype JKS \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore "${RUNNER_TEMP}/signing-check.p12" \
            -deststoretype PKCS12 \
            -deststorepass 'temporary-check-only-123!' \
            -destkeypass 'temporary-check-only-123!' \
            -noprompt >/dev/null

          echo "Android signing secrets are present and the keystore, alias, store password, key password, and certificate fingerprint are valid."
