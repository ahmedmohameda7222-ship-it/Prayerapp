name: Android TWA

on:
  pull_request:
    paths:
      - "android-twa/**"
      - "app/api/android/**"
      - "app/api/cron/prayer-reminders/**"
      - "components/providers/NativeAndroidProvider.tsx"
      - "components/settings/PrayerSystemTestControls.tsx"
      - "lib/android/**"
      - "lib/prayer-reminder-delivery.ts"
      - "lib/__tests__/android-*.test.ts"
      - "public/sw.js"
      - "public/manifest.webmanifest"
      - "public/.well-known/assetlinks.json"
      - ".github/workflows/android-twa.yml"
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - "app/api/android/**"
      - "app/api/cron/prayer-reminders/**"
      - "components/providers/NativeAndroidProvider.tsx"
      - "components/settings/PrayerSystemTestControls.tsx"
      - "lib/android/**"
      - "lib/prayer-reminder-delivery.ts"
      - "lib/__tests__/android-*.test.ts"
      - "public/sw.js"
      - "public/manifest.webmanifest"
      - "public/.well-known/assetlinks.json"
      - ".github/workflows/android-twa.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful unsigned Android TWA workflow run to sign
        required: false
        type: string
      source_sha:
        description: Exact approved pull-request head SHA represented by the unsigned artifact
        required: false
        type: string
      confirmation:
        description: Type SIGN_ANDROID_RC to enter the protected isolated signing job
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: android-twa-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    name: Verify Android project and build unsigned candidate
    if: github.event_name != 'workflow_dispatch' || inputs.confirmation != 'SIGN_ANDROID_RC'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test, lint, and build debug plus unsigned release artifacts
        run: >-
          ./gradlew --no-daemon
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
          --stacktrace

      - name: Prepare exact-head unsigned candidate
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          test "$source_sha" = "$(git rev-parse HEAD)"
          output_dir="app/build/unsigned-candidate"
          mkdir -p "$output_dir"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$output_dir/danube-mosque-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$output_dir/danube-mosque-unsigned.aab"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$source_sha" \
            --arg pr_number "${PR_NUMBER:-}" \
            --slurpfile manifest twa-manifest.json \
            '{repository: $repository, sourceSha: $source_sha, pullRequest: $pr_number, android: $manifest[0]}' \
            > "$output_dir/source-metadata.json"
          (cd "$output_dir" && sha256sum danube-mosque-unsigned.apk danube-mosque-unsigned.aab source-metadata.json > SHA256SUMS.txt)

      - name: Upload debug diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: danube-mosque-debug-diagnostic
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned exact-head candidate
        uses: actions/upload-artifact@v4
        with:
          name: danube-mosque-unsigned-candidate
          path: |
            android-twa/app/build/unsigned-candidate/danube-mosque-unsigned.apk
            android-twa/app/build/unsigned-candidate/danube-mosque-unsigned.aab
            android-twa/app/build/unsigned-candidate/source-metadata.json
            android-twa/app/build/unsigned-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Run Android instrumentation tests
    if: github.event_name != 'workflow_dispatch' || inputs.confirmation != 'SIGN_ANDROID_RC'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator image
        run: >-
          sdkmanager
          "platform-tools"
          "emulator"
          "platforms;android-35"
          "system-images;android-35;google_apis;x86_64"

      - name: Enable KVM access
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Create emulator
        shell: bash
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name ci-api-35 \
            --package "system-images;android-35;google_apis;x86_64"

      - name: Start emulator and wait for boot
        shell: bash
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd ci-api-35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run instrumentation tests
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Capture emulator diagnostics
        if: failure()
        shell: bash
        run: |
          adb logcat -d > "$RUNNER_TEMP/android-logcat.txt" || true
          cat "$RUNNER_TEMP/android-emulator.log" || true
          cat "$RUNNER_TEMP/android-logcat.txt" || true

      - name: Stop emulator
        if: always()
        run: adb emu kill || true

  signed_release_candidate:
    name: Sign approved exact-head release candidate in isolation
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'SIGN_ANDROID_RC'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Validate explicit source authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.run_id }}' =~ ^[0-9]+$ ]]
          [[ '${{ inputs.source_sha }}' =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.run_id }}")"
          test "$(printf '%s' "$run_json" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$run_json" | jq -r '.event')" = "pull_request"
          test "$(printf '%s' "$run_json" | jq -r '.name')" = "Android TWA"

      - name: Download exact unsigned candidate without checking out PR code
        uses: actions/download-artifact@v4
        with:
          name: danube-mosque-unsigned-candidate
          path: unsigned
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify unsigned candidate provenance and identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          cd unsigned
          sha256sum --check SHA256SUMS.txt
          test "$(jq -r '.repository' source-metadata.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.sourceSha' source-metadata.json)" = '${{ inputs.source_sha }}'
          pr_number="$(jq -r '.pullRequest' source-metadata.json)"
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          test "$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')" = "$GITHUB_REPOSITORY"
          test "$(printf '%s' "$pr_json" | jq -r '.head.sha')" = '${{ inputs.source_sha }}'
          package_id="$(jq -r '.android.packageId' source-metadata.json)"
          version_code="$(jq -r '.android.versionCode' source-metadata.json)"
          version_name="$(jq -r '.android.versionName' source-metadata.json)"
          target_sdk="$(jq -r '.android.targetSdkVersion' source-metadata.json)"
          test "$package_id" = "de.donaumoschee.app"
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$target_sdk" = "36"
          {
            printf 'package_id=%s\n' "$package_id"
            printf 'version_code=%s\n' "$version_code"
            printf 'version_name=%s\n' "$version_name"
            printf 'target_sdk=%s\n' "$target_sdk"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install signing and verification tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Reconstruct and verify permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test "$ANDROID_KEY_ALIAS" = "danube-mosque-release"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/danube-mosque-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          certificate="$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          actual="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"

      - name: Sign isolated APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/danube-mosque-release.jks"
          mkdir signed
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 unsigned/danube-mosque-unsigned.apk signed/danube-mosque-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out signed/danube-mosque.apk \
            signed/danube-mosque-aligned.apk
          cp unsigned/danube-mosque-unsigned.aab signed/danube-mosque.aab
          jarsigner \
            -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -sigalg SHA384withRSA \
            -digestalg SHA-256 \
            signed/danube-mosque.aab "$ANDROID_KEY_ALIAS"
          rm -f signed/danube-mosque-aligned.apk

      - name: Cryptographically verify signed release candidate
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.metadata.outputs.package_id }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          TARGET_SDK: ${{ steps.metadata.outputs.target_sdk }}
        run: |
          set -euo pipefail
          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs signed/danube-mosque.apk)"
          printf '%s\n' "$signature"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging signed/danube-mosque.apk)"
          printf '%s\n' "$badging" | grep -F "package: name='$PACKAGE_ID' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          printf '%s\n' "$badging" | grep -F "targetSdkVersion:'$TARGET_SDK'"
          ! printf '%s\n' "$badging" | grep -F "$PACKAGE_ID.debug"
          jarsigner -verify -verbose -certs signed/danube-mosque.aab
          aab_certificate="$(keytool -printcert -jarfile signed/danube-mosque.aab)"
          aab_actual="$(printf '%s\n' "$aab_certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$aab_actual" = "$EXPECTED_CERT_SHA256"
          unzip -t signed/danube-mosque.aab
          (cd signed && sha256sum danube-mosque.apk danube-mosque.aab > SHA256SUMS.txt)

      - name: Remove reconstructed signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/danube-mosque-release.jks"

      - name: Upload signed Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: danube-mosque-android-rc-${{ inputs.source_sha }}
          path: |
            signed/danube-mosque.apk
            signed/danube-mosque.aab
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
