name: Android TWA

on:
  pull_request:
    paths:
      - "android-twa/**"
      - "public/manifest.webmanifest"
      - "public/.well-known/assetlinks.json"
      - "lib/__tests__/android-twa-contract.test.ts"
      - ".github/workflows/android-twa.yml"
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - "public/manifest.webmanifest"
      - "public/.well-known/assetlinks.json"
      - "lib/__tests__/android-twa-contract.test.ts"
      - ".github/workflows/android-twa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Lint and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: danube-mosque-twa-debug
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
