name: Android TWA

on:
  pull_request:
    paths:
      - "android-twa/**"
      - "public/manifest.webmanifest"
      - "public/.well-known/assetlinks.json"
      - "lib/__tests__/android-twa-contract.test.ts"
      - ".github/workflows/android-twa.yml"
  push:
    branches: [main]
    paths:
      - "android-twa/**"
      - "public/manifest.webmanifest"
      - "public/.well-known/assetlinks.json"
      - "lib/__tests__/android-twa-contract.test.ts"
      - ".github/workflows/android-twa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit test, lint, and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: danube-mosque-debug-diagnostic
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed_release_candidate:
    name: Build and verify signed release candidate
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-twa
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Reconstruct and verify permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test "$ANDROID_KEY_ALIAS" = "danube-mosque-release"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/danube-mosque-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          certificate="$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          actual="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > signing.properties
          chmod 600 signing.properties

      - name: Test, lint, and build signed APK and AAB
        run: ./gradlew --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Cryptographically verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          output_dir="app/build/release-candidate"
          mkdir -p "$output_dir"
          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signature"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk")"
          printf '%s\n' "$badging"
          printf '%s\n' "$badging" | grep -F "package: name='de.donaumoschee.app' versionCode='2' versionName='1.0.0'"
          printf '%s\n' "$badging" | grep -F "targetSdkVersion:'36'"
          ! printf '%s\n' "$badging" | grep -F "de.donaumoschee.app.debug"
          jarsigner -verify -verbose -certs "$aab"
          aab_certificate="$(keytool -printcert -jarfile "$aab")"
          aab_actual="$(printf '%s\n' "$aab_certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$aab_actual" = "$EXPECTED_CERT_SHA256"
          unzip -t "$aab"
          cp "$apk" "$output_dir/danube-mosque.apk"
          cp "$aab" "$output_dir/danube-mosque.aab"
          (cd "$output_dir" && sha256sum danube-mosque.apk danube-mosque.aab > SHA256SUMS.txt)

      - name: Remove reconstructed signing material
        if: always()
        shell: bash
        run: |
          rm -f signing.properties "$RUNNER_TEMP/danube-mosque-release.jks"

      - name: Upload signed Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: danube-mosque-android-rc
          path: |
            android-twa/app/build/release-candidate/danube-mosque.apk
            android-twa/app/build/release-candidate/danube-mosque.aab
            android-twa/app/build/release-candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
