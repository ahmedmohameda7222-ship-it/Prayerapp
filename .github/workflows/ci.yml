name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Verify binding security authority hashes
        run: |
          printf '%s  %s\n' \
            '1c99f9c635dee2bf3d8fc9004a3dbf2ced02fd6bb04631af8f4edefd66de1f52' \
            'docs/superpowers/plans/2026-09-02-prelaunch-security-remediation.md' \
            '0d20af901d559b51b4f26b5b24f6e3920f828580801f1a6d518d31d9a23ae2b4' \
            'docs/security/prelaunch/2026-09-02/approved-execution-checklist.md' \
            'ab8a2a167a07085c036111f6246fa79e07c5d6fa0313b236f3d7ab04ebbbef81' \
            'docs/security/prelaunch/2026-09-02/approved-open-control-matrix.json' \
            | sha256sum -c -
      - run: git diff --check origin/main...HEAD -- . ':(exclude)docs/superpowers/plans/2026-09-02-prelaunch-security-remediation.md' ':(exclude)docs/security/prelaunch/2026-09-02/approved-execution-checklist.md'
      - run: npm ci
      - name: Verify open-control closure ledger is deterministically generated
        run: node scripts/security/generate-open-control-closure-ledger.mjs --check
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - name: Verify clean Supabase migration bootstrap
        run: |
          supabase start
          supabase db reset --local --no-seed
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.user_saved_azkar') is null then
              raise exception 'user_saved_azkar missing after clean migration reset';
            end if;
            if to_regclass('public.user_prayer_reminders') is null then
              raise exception 'user_prayer_reminders missing after clean migration reset';
            end if;
            if to_regclass('public.native_prayer_installations') is null then
              raise exception 'native_prayer_installations missing after clean migration reset';
            end if;
            if to_regclass('public.native_prayer_delivery_receipts') is null then
              raise exception 'native_prayer_delivery_receipts missing after clean migration reset';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'native_prayer_installations'
                and column_name = 'receipt_v2'
                and data_type = 'boolean'
                and is_nullable = 'NO'
                and column_default = 'false'
            ) then
              raise exception 'native_prayer_installations.receipt_v2 contract missing after clean migration reset';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'native_prayer_installations'
                and column_name = 'account_generation'
                and data_type = 'integer'
                and is_nullable = 'NO'
                and column_default = '0'
            ) then
              raise exception 'native_prayer_installations.account_generation contract missing after clean migration reset';
            end if;
            if not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_installations'::regclass
                and c.contype = 'c'
                and regexp_replace(lower(pg_get_expr(c.conbin, c.conrelid)), '[[:space:]]+', '', 'g')
                  in ('(account_generation>=0)', 'account_generation>=0')
            ) then
              raise exception 'native_prayer_installations.account_generation CHECK missing after clean migration reset';
            end if;
            if not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'p'
                and pg_get_constraintdef(c.oid, true) =
                  'PRIMARY KEY (installation_id, account_generation, event_id)'
            ) then
              raise exception 'native delivery receipt primary key missing after clean migration reset';
            end if;
            if not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'f'
                and pg_get_constraintdef(c.oid, true) ilike
                  'FOREIGN KEY (installation_id) REFERENCES native_prayer_installations(installation_id) ON DELETE CASCADE'
            ) then
              raise exception 'native delivery receipt installation FK missing after clean migration reset';
            end if;
            if not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'f'
                and pg_get_constraintdef(c.oid, true) ilike
                  'FOREIGN KEY (user_id) REFERENCES auth.users(id) ON DELETE CASCADE'
            ) then
              raise exception 'native delivery receipt user FK missing after clean migration reset';
            end if;
            if (
              select count(*) from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'c'
            ) <> 4 or not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'c'
                and pg_get_constraintdef(c.oid, true) ~ 'event_id.*p2:.*0-9a-f.*64'
            ) or not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'c'
                and pg_get_constraintdef(c.oid, true) ~ 'kind.*reminder.*adhan'
            ) or not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'c'
                and pg_get_constraintdef(c.oid, true) ~ 'account_generation.*>= 0'
            ) or not exists (
              select 1 from pg_constraint c
              where c.conrelid = 'public.native_prayer_delivery_receipts'::regclass
                and c.contype = 'c'
                and pg_get_constraintdef(c.oid, true) ~ 'expires_at > delivered_at'
            ) or not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'native_prayer_delivery_receipts'
                and column_name = 'expires_at'
                and column_default = '(now() + ''2 days''::interval)'
            ) or not exists (
              select 1 from information_schema.columns
              where table_schema = 'public'
                and table_name = 'native_prayer_delivery_receipts'
                and column_name = 'created_at'
                and column_default = 'now()'
            ) then
              raise exception 'native delivery receipt CHECK contract missing after clean migration reset';
            end if;
            if not exists (
              select 1 from pg_indexes
              where schemaname = 'public'
                and tablename = 'native_prayer_delivery_receipts'
                and indexname = 'native_prayer_delivery_receipts_event_idx'
                and indexdef like '%(event_id, expires_at, installation_id)%'
            ) or not exists (
              select 1 from pg_indexes
              where schemaname = 'public'
                and tablename = 'native_prayer_delivery_receipts'
                and indexname = 'native_prayer_delivery_receipts_expiry_idx'
                and indexdef like '%(expires_at)%'
            ) then
              raise exception 'native delivery receipt indexes missing after clean migration reset';
            end if;
            if not exists (
              select 1 from pg_class r
              where r.oid = 'public.native_prayer_delivery_receipts'::regclass
                and r.relrowsecurity
            ) then
              raise exception 'native delivery receipt RLS missing after clean migration reset';
            end if;
            if has_table_privilege('anon', 'public.native_prayer_delivery_receipts', 'SELECT')
              or has_table_privilege('anon', 'public.native_prayer_delivery_receipts', 'INSERT')
              or has_table_privilege('anon', 'public.native_prayer_delivery_receipts', 'UPDATE')
              or has_table_privilege('anon', 'public.native_prayer_delivery_receipts', 'DELETE')
              or has_table_privilege('authenticated', 'public.native_prayer_delivery_receipts', 'SELECT')
              or has_table_privilege('authenticated', 'public.native_prayer_delivery_receipts', 'INSERT')
              or has_table_privilege('authenticated', 'public.native_prayer_delivery_receipts', 'UPDATE')
              or has_table_privilege('authenticated', 'public.native_prayer_delivery_receipts', 'DELETE')
              or not has_table_privilege('service_role', 'public.native_prayer_delivery_receipts', 'SELECT')
              or not has_table_privilege('service_role', 'public.native_prayer_delivery_receipts', 'INSERT')
              or not has_table_privilege('service_role', 'public.native_prayer_delivery_receipts', 'UPDATE')
              or not has_table_privilege('service_role', 'public.native_prayer_delivery_receipts', 'DELETE') then
              raise exception 'native delivery receipt privileges are not service-role-only';
            end if;
            if to_regclass('public.security_rate_limits') is null then
              raise exception 'security_rate_limits missing after clean migration reset';
            end if;
            if not has_table_privilege('service_role', 'public.native_prayer_installations', 'SELECT')
              or has_table_privilege('anon', 'public.native_prayer_installations', 'SELECT')
              or has_table_privilege('authenticated', 'public.native_prayer_installations', 'SELECT') then
              raise exception 'native prayer authority privileges are not service-role-only';
            end if;
            if not has_table_privilege('service_role', 'public.user_prayer_reminders', 'SELECT') then
              raise exception 'service_role lacks SELECT on user_prayer_reminders';
            end if;
            if has_table_privilege('anon', 'public.user_prayer_reminders', 'SELECT')
              or has_table_privilege('anon', 'public.user_prayer_reminders', 'INSERT')
              or has_table_privilege('anon', 'public.user_prayer_reminders', 'UPDATE')
              or has_table_privilege('anon', 'public.user_prayer_reminders', 'DELETE') then
              raise exception 'anon has personal reminder table privileges';
            end if;
            if has_table_privilege('anon', 'public.user_saved_azkar', 'SELECT')
              or has_table_privilege('anon', 'public.user_saved_azkar', 'INSERT')
              or has_table_privilege('anon', 'public.user_saved_azkar', 'UPDATE')
              or has_table_privilege('anon', 'public.user_saved_azkar', 'DELETE') then
              raise exception 'anon has personal Saved Azkar table privileges';
            end if;
            if not has_table_privilege('authenticated', 'public.user_saved_azkar', 'SELECT')
              or not has_table_privilege('authenticated', 'public.user_saved_azkar', 'INSERT')
              or not has_table_privilege('authenticated', 'public.user_saved_azkar', 'DELETE') then
              raise exception 'authenticated lacks Saved Azkar privileges';
            end if;
            if not has_table_privilege('authenticated', 'public.user_prayer_reminders', 'SELECT')
              or not has_table_privilege('authenticated', 'public.user_prayer_reminders', 'INSERT')
              or not has_table_privilege('authenticated', 'public.user_prayer_reminders', 'UPDATE')
              or not has_table_privilege('authenticated', 'public.user_prayer_reminders', 'DELETE') then
              raise exception 'authenticated lacks prayer reminder privileges';
            end if;
            if has_table_privilege('anon', 'public.security_rate_limits', 'SELECT')
              or has_table_privilege('anon', 'public.security_rate_limits', 'INSERT')
              or has_table_privilege('anon', 'public.security_rate_limits', 'UPDATE')
              or has_table_privilege('anon', 'public.security_rate_limits', 'DELETE')
              or has_table_privilege('authenticated', 'public.security_rate_limits', 'SELECT')
              or has_table_privilege('authenticated', 'public.security_rate_limits', 'INSERT')
              or has_table_privilege('authenticated', 'public.security_rate_limits', 'UPDATE')
              or has_table_privilege('authenticated', 'public.security_rate_limits', 'DELETE')
              or has_table_privilege('service_role', 'public.security_rate_limits', 'SELECT')
              or has_table_privilege('service_role', 'public.security_rate_limits', 'INSERT')
              or has_table_privilege('service_role', 'public.security_rate_limits', 'UPDATE')
              or has_table_privilege('service_role', 'public.security_rate_limits', 'DELETE') then
              raise exception 'security rate-limit state is directly accessible';
            end if;
            if not has_function_privilege(
              'service_role',
              'public.consume_security_rate_limit(text,text,integer,integer)',
              'EXECUTE'
            ) then
              raise exception 'service_role cannot execute security rate limiter';
            end if;
            if has_function_privilege(
              'anon',
              'public.consume_security_rate_limit(text,text,integer,integer)',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'public.consume_security_rate_limit(text,text,integer,integer)',
              'EXECUTE'
            ) then
              raise exception 'public roles can execute security rate limiter';
            end if;
            if to_regprocedure(
              'public.register_push_subscription(text,text,text,uuid,uuid,text,text,text,integer)'
            ) is null then
              raise exception 'atomic push registration RPC missing';
            end if;
            if not has_function_privilege(
              'service_role',
              'public.register_push_subscription(text,text,text,uuid,uuid,text,text,text,integer)',
              'EXECUTE'
            ) then
              raise exception 'service_role cannot execute atomic push registration RPC';
            end if;
            if has_function_privilege(
              'anon',
              'public.register_push_subscription(text,text,text,uuid,uuid,text,text,text,integer)',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'public.register_push_subscription(text,text,text,uuid,uuid,text,text,text,integer)',
              'EXECUTE'
            ) then
              raise exception 'public roles can execute atomic push registration RPC';
            end if;
          end
          $$;

          begin;
          alter table public.push_subscriptions disable trigger all;
          insert into public.push_subscriptions (
            endpoint, p256dh, auth, browser_id, user_id, enabled, locale
          )
          select
            'https://fcm.googleapis.com/fcm/send/atomic-cap-' || value,
            'test-p256dh',
            'test-auth',
            case when value = 1
              then '00000000-0000-4000-8000-000000000101'::uuid
              else gen_random_uuid()
            end,
            '00000000-0000-4000-8000-000000000001'::uuid,
            true,
            'en'
          from generate_series(1, 10) as value;

          do $$
          declare
            v_result text;
          begin
            select public.register_push_subscription(
              'https://fcm.googleapis.com/fcm/send/atomic-cap-new',
              'test-p256dh',
              'test-auth',
              '00000000-0000-4000-8000-000000000111'::uuid,
              '00000000-0000-4000-8000-000000000001'::uuid,
              'en',
              null,
              null,
              10
            ) into v_result;
            if v_result <> 'account_limit_reached' then
              raise exception 'atomic push registration allowed an 11th account subscription: %', v_result;
            end if;

            select public.register_push_subscription(
              'https://fcm.googleapis.com/fcm/send/atomic-cap-1',
              'refreshed-p256dh',
              'refreshed-auth',
              '00000000-0000-4000-8000-000000000101'::uuid,
              '00000000-0000-4000-8000-000000000001'::uuid,
              'de',
              null,
              null,
              10
            ) into v_result;
            if v_result <> 'saved' then
              raise exception 'atomic push registration blocked same-device refresh at cap: %', v_result;
            end if;
          end
          $$;
          rollback;
          SQL

          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/security/verify-production-schema.sql
      - name: Verify reconciliation idempotence and data preservation
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          {
            cat <<'SQL'
          begin;
          insert into auth.users (id, aud, role, created_at, updated_at)
          values (
            '00000000-0000-4000-8000-000000000212'::uuid,
            'authenticated',
            'authenticated',
            now(),
            now()
          );
          insert into public.native_prayer_installations (
            installation_id, user_id, credential_hash
          ) values (
            '00000000-0000-4000-8000-000000000211'::uuid,
            '00000000-0000-4000-8000-000000000212'::uuid,
            repeat('a', 64)
          );
          SQL
            cat supabase/migrations/20260902211847_prelaunch_schema_reconciliation.sql
            cat supabase/migrations/20260902211847_prelaunch_schema_reconciliation.sql
            cat <<'SQL'
          do $$
          begin
            if not exists (
              select 1
              from public.native_prayer_installations
              where installation_id = '00000000-0000-4000-8000-000000000211'::uuid
                and user_id = '00000000-0000-4000-8000-000000000212'::uuid
                and credential_hash = repeat('a', 64)
                and receipt_v2 = false
                and account_generation = 0
            ) then
              raise exception 'synthetic native installation row was not preserved';
            end if;
          end
          $$;
          rollback;
          SQL
          } | docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Verify reconciliation rejects incompatible partial schemas
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"

          set +e
          receipt_output="$({
            cat <<'SQL'
          begin;
          drop table public.native_prayer_delivery_receipts;
          alter table public.native_prayer_installations drop column receipt_v2;
          alter table public.native_prayer_installations drop column account_generation;
          alter table public.native_prayer_installations
            add column receipt_v2 boolean not null default false;
          alter table public.native_prayer_installations
            add constraint synthetic_incompatible_receipt_v2_check check (receipt_v2 = true);
          SQL
            cat supabase/migrations/20260902211847_prelaunch_schema_reconciliation.sql
          } | docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1)"
          receipt_status=$?
          set -e
          if [ "$receipt_status" -eq 0 ] || ! grep -Fq 'incompatible pre-existing receipt_v2 constraint' <<<"$receipt_output"; then
            echo 'incompatible receipt_v2 constraint was not rejected'
            printf '%s\n' "$receipt_output"
            exit 1
          fi

          set +e
          generation_output="$({
            cat <<'SQL'
          begin;
          drop table public.native_prayer_delivery_receipts;
          alter table public.native_prayer_installations drop column receipt_v2;
          alter table public.native_prayer_installations drop column account_generation;
          alter table public.native_prayer_installations
            add column account_generation integer not null default 0;
          alter table public.native_prayer_installations
            add constraint synthetic_incompatible_account_generation_check check (account_generation > 0);
          SQL
            cat supabase/migrations/20260902211847_prelaunch_schema_reconciliation.sql
          } | docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1)"
          generation_status=$?
          set -e
          if [ "$generation_status" -eq 0 ] || ! grep -Fq 'incompatible pre-existing account_generation constraint' <<<"$generation_output"; then
            echo 'incompatible account_generation constraint was not rejected'
            printf '%s\n' "$generation_output"
            exit 1
          fi
      - name: Verify admin audit idempotence and data preservation
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          {
            cat <<'SQL'
          begin;
          select public.append_admin_audit_event(
            '00000000-0000-4000-8000-000000000601'::uuid,
            'security-test@local.invalid',
            'security.audit.idempotence',
            'audit_logs',
            'synthetic-local-row',
            'attempt',
            '{"source":"ci","safe":true}'::jsonb,
            'ci-admin-audit-idempotence'
          );
          SQL
            cat supabase/migrations/20260902215000_admin_audit_hardening.sql
            cat supabase/migrations/20260902215000_admin_audit_hardening.sql
            cat <<'SQL'
          do $$
          begin
            if (
              select count(*)
              from public.audit_logs
              where actor_user_id = '00000000-0000-4000-8000-000000000601'::uuid
                and actor = 'security-test@local.invalid'
                and action = 'security.audit.idempotence'
                and entity_type = 'audit_logs'
                and entity_id = 'synthetic-local-row'
                and outcome = 'attempt'
                and metadata = '{"source":"ci","safe":true}'::jsonb
                and request_id = 'ci-admin-audit-idempotence'
            ) <> 1 then
              raise exception 'synthetic admin audit row was not preserved';
            end if;
          end
          $$;
          rollback;
          SQL
          } | docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1

          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/security/verify-production-schema.sql
      - name: Verify admin audit rejects non-empty legacy state
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"

          set +e
          legacy_output="$({
            cat <<'SQL'
          begin;
          insert into public.audit_logs (
            actor, action, entity_type, entity_id, actor_user_id, outcome, metadata, request_id
          ) values (
            'legacy-test@local.invalid',
            'security.audit.legacy',
            'audit_logs',
            'synthetic-legacy-row',
            '00000000-0000-4000-8000-000000000602'::uuid,
            'attempt',
            '{}'::jsonb,
            'ci-admin-audit-legacy'
          );
          alter table public.audit_logs drop column actor_user_id;
          alter table public.audit_logs drop column outcome;
          alter table public.audit_logs drop column metadata;
          alter table public.audit_logs drop column request_id;
          SQL
            cat supabase/migrations/20260902215000_admin_audit_hardening.sql
          } | docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1)"
          legacy_status=$?
          set -e
          if [ "$legacy_status" -eq 0 ] || ! grep -Fq 'cannot add actor_user_id to non-empty audit_logs without truthful historical actor evidence' <<<"$legacy_output"; then
            echo 'non-empty legacy audit state was not rejected'
            printf '%s\n' "$legacy_output"
            exit 1
          fi

          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/security/verify-production-schema.sql
      - run: npm run build
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
