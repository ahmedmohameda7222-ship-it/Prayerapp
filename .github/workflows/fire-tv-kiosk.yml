name: Fire TV Kiosk APK

on:
  pull_request:
    paths:
      - "fire-tv-kiosk/**"
      - "masjid-display/lib/runtime/screen-wake-lock.ts"
      - "masjid-display/lib/runtime/stay-awake-control.test.ts"
      - "masjid-display/components/StayAwakeControl.tsx"
      - ".github/workflows/fire-tv-kiosk.yml"
  push:
    branches: [main]
    paths:
      - "fire-tv-kiosk/**"
      - ".github/workflows/fire-tv-kiosk.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fire-tv-kiosk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, build sideloadable Fire TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools"

      - name: Install SDK platform and tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate shared Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Test, lint and assemble Fire TV kiosk
        run: >-
          ./android-twa/gradlew --no-daemon -p fire-tv-kiosk
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          --stacktrace

      - name: Check Android TV launchability and APK package
        shell: bash
        run: |
          set -euo pipefail
          apk=fire-tv-kiosk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/fire-tv-badging.txt
          grep -F "name='de.donaumoschee.firetv'" /tmp/fire-tv-badging.txt
          grep -E "launchable-activity|leanback-launchable-activity" /tmp/fire-tv-badging.txt
          sha256sum "$apk" > fire-tv-kiosk/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload sideloadable debug-signed APK for Fire OS field test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prayerapp-fire-tv-kiosk-debug-apk
          path: |
            fire-tv-kiosk/app/build/outputs/apk/debug/app-debug.apk
            fire-tv-kiosk/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
