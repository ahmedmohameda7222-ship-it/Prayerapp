name: Friday V2 Rendered QA

on:
  pull_request:
    branches: [main]

concurrency:
  group: friday-v2-rendered-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-qa:
    if: github.head_ref == 'feat/friday-v2-khutbah-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start disposable local Supabase
        run: |
          supabase start
          supabase db reset --local --no-seed
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Seed deterministic Friday rows
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.prayer_times (
            date, fajr, sunrise, dhuhr, asr, maghrib, isha,
            fajr_iqama, dhuhr_iqama, asr_iqama, maghrib_iqama, isha_iqama,
            published
          ) VALUES
            ('2026-08-26', '04:45', '06:18', '12:18', '16:20', '20:05', '21:30', '05:05', '13:00', '16:35', '20:10', '21:45', true),
            ('2026-08-28', '04:49', '06:21', '12:18', '16:17', '20:01', '21:25', '05:09', '13:00', '16:32', '20:06', '21:40', true)
          ON CONFLICT (date) DO UPDATE SET published = true, dhuhr = EXCLUDED.dhuhr, dhuhr_iqama = EXCLUDED.dhuhr_iqama;

          DELETE FROM public.jumuah_times WHERE date = '2026-08-28';
          INSERT INTO public.jumuah_times (
            date, khutbah_time, prayer_time, location_name, location_address,
            khateeb_name, language, published
          ) VALUES
            ('2026-08-28', NULL, '13:30', 'Danube Mosque', 'Deggendorf, Germany', '', 'Arabic / German', true),
            ('2026-08-28', NULL, '14:30', 'Danube Mosque', 'Deggendorf, Germany', '', 'Arabic / German', true);

          INSERT INTO public.friday_khutbahs (date, content_ar, content_en, content_de, content_tr, published)
          VALUES ('2026-08-28', 'نص عربي', 'English text', 'Deutscher Text', 'Türkçe metin', true)
          ON CONFLICT (date) DO UPDATE SET published = true, content_ar = EXCLUDED.content_ar;
          SQL

      - name: Diagnose DB role and REST authentication
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          echo '=== postgres owner visibility ==='
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc "select date||'|'||dhuhr||'|'||published from public.prayer_times where date between '2026-08-26' and '2026-08-28' order by date"
          echo '=== anon role visibility ==='
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc "set role anon; select date||'|'||dhuhr||'|'||published from public.prayer_times where date between '2026-08-26' and '2026-08-28' order by date"
          echo '=== policies ==='
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc "select tablename||'|'||policyname||'|'||roles::text||'|'||qual from pg_policies where schemaname='public' and tablename in ('prayer_times','jumuah_times','friday_khutbahs') order by tablename,policyname"
          echo '=== grants ==='
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc "select table_name||'|'||grantee||'|'||privilege_type from information_schema.role_table_grants where table_schema='public' and table_name in ('prayer_times','jumuah_times','friday_khutbahs') and grantee in ('anon','authenticated') order by table_name,grantee,privilege_type"

          if [[ "$NEXT_PUBLIC_SUPABASE_ANON_KEY" == sb_publishable_* ]]; then echo 'anon key type=publishable'; else echo 'anon key type=legacy-jwt'; fi

          echo '=== REST apikey only ==='
          curl --fail --silent --show-error \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/prayer_times?select=date,dhuhr,published&date=gte.2026-08-26&date=lte.2026-08-28&order=date.asc"
          echo
          echo '=== REST apikey plus bearer ==='
          curl --fail --silent --show-error \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/prayer_times?select=date,dhuhr,published&date=gte.2026-08-26&date=lte.2026-08-28&order=date.asc"
          echo

      - name: Stop local services
        if: always()
        run: supabase stop --no-backup || true
