name: Friday V2 Targeted Rendered QA

on:
  pull_request:
    branches: [main]

concurrency:
  group: friday-v2-targeted-rendered-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-rendered-qa:
    if: github.head_ref == 'feat/friday-v2-khutbah-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Install application dependencies
        run: npm ci

      - name: Start disposable local Supabase
        run: |
          supabase start
          supabase db reset --local --no-seed
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Seed Primary-only Friday state
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.prayer_times (
            date, fajr, sunrise, dhuhr, asr, maghrib, isha,
            fajr_iqama, dhuhr_iqama, asr_iqama, maghrib_iqama, isha_iqama,
            published
          ) VALUES
            ('2026-08-26', '04:45', '06:18', '12:18', '16:20', '20:05', '21:30', '05:05', '13:00', '16:35', '20:10', '21:45', true),
            ('2026-08-28', '04:49', '06:21', '12:18', '16:17', '20:01', '21:25', '05:09', '13:00', '16:32', '20:06', '21:40', true)
          ON CONFLICT (date) DO UPDATE SET
            dhuhr = EXCLUDED.dhuhr,
            dhuhr_iqama = EXCLUDED.dhuhr_iqama,
            published = true;

          DELETE FROM public.jumuah_times WHERE date = '2026-08-28';
          DELETE FROM public.friday_khutbahs WHERE date = '2026-08-28';
          SQL

          test "$(docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc "select count(*) from public.jumuah_times where date='2026-08-28'")" = "0"

      - name: Build application
        run: npm run build

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          npm start -- -p 3000 > /tmp/friday-v2-targeted-next.log 2>&1 &
          echo $! > /tmp/friday-v2-targeted-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/friday-v2-targeted-next.log
          exit 1

      - name: Verify Primary-only, Next Prayer, nav, focus, and text scaling
        run: |
          mkdir -p artifacts/friday-v2-targeted-rendered-qa
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const baseUrl = 'http://127.0.0.1:3000';
          const widths = [320, 375, 390, 430, 768, 1440];
          const locales = ['ar', 'en', 'de', 'tr'];
          const browserLocale = { ar: 'ar-EG', en: 'en-US', de: 'de-DE', tr: 'tr-TR' };
          const browser = await chromium.launch({ headless: true });

          async function noOverflow(page, width, label) {
            const state = await page.evaluate(() => ({
              html: document.documentElement.scrollWidth,
              body: document.body.scrollWidth,
              client: document.documentElement.clientWidth,
            }));
            assert.ok(state.html <= width + 1 && state.body <= width + 1, `${label}: ${JSON.stringify(state)}`);
          }

          async function open(page, path) {
            const response = await page.goto(`${baseUrl}${path}`, { waitUntil: 'networkidle' });
            assert.ok(response && response.ok(), `${path} returned ${response?.status()}`);
            await page.waitForTimeout(250);
          }

          for (const locale of locales) {
            for (const width of widths) {
              const context = await browser.newContext({ viewport: { width, height: 1050 }, locale: browserLocale[locale], serviceWorkers: 'block' });
              await context.addCookies([{ name: 'locale', value: locale, url: baseUrl }]);
              const page = await context.newPage();
              await page.emulateMedia({ reducedMotion: 'reduce' });

              await open(page, '/');
              await noOverflow(page, width, `home ${locale} ${width}`);
              const homeCard = page.getByTestId('home-jumuah-card');
              await homeCard.waitFor({ state: 'visible' });
              const homeText = await homeCard.innerText();
              assert.ok(homeText.includes('12:18'), `Home Primary Dhuhr ${locale} ${width}`);
              assert.ok(!homeText.includes('13:00'), `Home must not use Dhuhr Iqama ${locale} ${width}`);
              assert.equal(await homeCard.locator('.home-jumuah-time-row').count(), 1, `Home Primary-only count ${locale} ${width}`);

              const nextSurface = page.getByTestId('home-next-prayer-surface');
              await nextSurface.waitFor({ state: 'visible' });
              const nextImageState = await nextSurface.locator('.home-next-prayer-media img').evaluate((img) => {
                const imageBox = img.getBoundingClientRect();
                const mediaBox = img.closest('.home-next-prayer-media')?.getBoundingClientRect();
                return {
                  objectFit: getComputedStyle(img).objectFit,
                  imageWidth: imageBox.width,
                  imageHeight: imageBox.height,
                  mediaWidth: mediaBox?.width || 0,
                  mediaHeight: mediaBox?.height || 0,
                };
              });
              if (width <= 420) {
                assert.equal(nextImageState.objectFit, 'cover', `Next Prayer narrow object-fit ${locale} ${width}`);
              }
              assert.ok(Math.abs(nextImageState.imageWidth - nextImageState.mediaWidth) <= 1, `Next Prayer width fill ${locale} ${width}`);
              assert.ok(Math.abs(nextImageState.imageHeight - nextImageState.mediaHeight) <= 1, `Next Prayer height fill ${locale} ${width}`);

              const nav = page.locator('.bottom-nav-shell');
              await nav.waitFor({ state: 'visible' });
              const fridayLink = nav.locator('a[href="/friday"]');
              assert.equal(await fridayLink.count(), 1, `Friday tab exists ${locale} ${width}`);
              for (const link of await nav.locator('a').all()) {
                const box = await link.boundingBox();
                assert.ok(box && box.height >= 44, `bottom nav target ${locale} ${width}`);
                assert.ok(box.x >= -1 && box.x + box.width <= width + 1, `bottom nav viewport ${locale} ${width}`);
              }

              await open(page, '/friday');
              await noOverflow(page, width, `Friday ${locale} ${width}`);
              const rows = page.locator('.friday-service-row');
              assert.equal(await rows.count(), 1, `Friday Primary-only count ${locale} ${width}`);
              const primary = page.locator('.friday-service-row[data-primary="true"]');
              assert.equal(await primary.count(), 1, `Friday Primary exists ${locale} ${width}`);
              const primaryText = await primary.innerText();
              assert.ok(primaryText.includes('12:18'), `Friday Primary Dhuhr ${locale} ${width}`);
              assert.ok(!primaryText.includes('13:00'), `Friday not Dhuhr Iqama ${locale} ${width}`);
              assert.equal(await page.getByTestId('friday-khutbah-cta').count(), 0, `No CTA without published khutbah ${locale} ${width}`);

              const firstFocusable = page.locator('a[href="/"]').last();
              if (await firstFocusable.count()) {
                await firstFocusable.focus();
                assert.equal(await firstFocusable.evaluate((el) => document.activeElement === el), true, `keyboard focus ${locale} ${width}`);
              }

              if (width === 320) {
                await page.addStyleTag({ content: 'html { font-size: 125% !important; }' });
                await page.waitForTimeout(100);
                await noOverflow(page, width, `Friday text-scale ${locale} ${width}`);
                const scaledPrimary = await primary.boundingBox();
                assert.ok(scaledPrimary && scaledPrimary.height > 0, `Primary content retained under text scaling ${locale}`);
              }

              await page.screenshot({ path: `artifacts/friday-v2-targeted-rendered-qa/primary-only-${locale}-${width}.png`, fullPage: true });
              await context.close();
            }
          }

          await browser.close();
          console.log('Friday V2 targeted rendered QA passed Primary-only, approved narrow Next Prayer image-fill, bottom-nav, keyboard-focus, and text-scale checks across 24 locale/width combinations.');
          NODE

      - name: Upload targeted QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-v2-targeted-rendered-qa
          path: artifacts/friday-v2-targeted-rendered-qa
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/friday-v2-targeted-next.log || true

      - name: Stop local services
        if: always()
        run: |
          if test -f /tmp/friday-v2-targeted-next.pid; then kill "$(cat /tmp/friday-v2-targeted-next.pid)" || true; fi
          supabase stop --no-backup || true
