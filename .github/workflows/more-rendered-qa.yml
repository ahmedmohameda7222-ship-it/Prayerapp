name: More Rendered QA

on:
  pull_request:
    paths:
      - "app/more/**"
      - "components/more/**"
      - ".github/workflows/more-rendered-qa.yml"

permissions:
  contents: read

jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build production app
        run: npm run build
      - name: Install isolated Playwright Chromium
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --package-lock=false playwright@1.55.0
          /tmp/pw/node_modules/.bin/playwright install chromium
      - name: Start production app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/prayerapp-prod.log 2>&1 &
          echo $! > /tmp/prayerapp-prod.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/more >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prayerapp-prod.log
          exit 1
      - name: Rendered mobile QA
        run: |
          cat > /tmp/pw/more-qa.cjs <<'EOF'
          const { chromium, devices } = require('playwright');
          const fs = require('node:fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              ...devices['iPhone 13'],
              locale: 'ar-EG',
            });
            await context.addCookies([{ name: 'locale', value: 'ar', domain: '127.0.0.1', path: '/' }]);

            const page = await context.newPage();
            const consoleIssues = [];
            page.on('console', msg => {
              if (['error', 'warning'].includes(msg.type())) consoleIssues.push(`${msg.type()}: ${msg.text()}`);
            });
            page.on('pageerror', err => consoleIssues.push(`pageerror: ${err.message}`));

            await page.goto('http://127.0.0.1:3000/more', { waitUntil: 'networkidle' });

            const dismiss = page.getByRole('button', { name: 'فهمت' });
            if (await dismiss.isVisible().catch(() => false)) {
              await dismiss.click();
              await page.waitForTimeout(250);
            }

            const title = await page.title();
            const url = page.url();
            const bodyText = await page.locator('body').innerText();
            const htmlLang = await page.locator('html').getAttribute('lang');
            const htmlDir = await page.locator('html').getAttribute('dir');
            const moreSections = page.locator('section[aria-labelledby^="more-"]');
            const sectionCount = await moreSections.count();
            const listCount = await page.locator('[role="list"]').count();
            const rowCount = await page.locator('[role="listitem"]').count();
            const frameworkOverlayCount = await page.locator('[data-nextjs-dialog-overlay]').count();
            const headings = await moreSections.locator('h2').allTextContents();

            await page.screenshot({ path: '/tmp/more-mobile.png', fullPage: false });
            await page.screenshot({ path: '/tmp/more-mobile-full.png', fullPage: true });

            const firstRow = page.locator('[role="listitem"]').first();
            const firstHref = await firstRow.getAttribute('href');
            await firstRow.click();
            await page.waitForURL('**/azkar');
            const interactedUrl = page.url();

            const relevantConsoleErrors = consoleIssues.filter(issue =>
              issue.startsWith('pageerror:') ||
              (issue.startsWith('error:') && !issue.includes('fonts.googleapis.com'))
            );

            const report = {
              title,
              url,
              htmlLang,
              htmlDir,
              sectionCount,
              listCount,
              rowCount,
              frameworkOverlayCount,
              headings,
              firstHref,
              interactedUrl,
              bodySample: bodyText.slice(0, 2000),
              consoleIssues,
              relevantConsoleErrors,
            };
            fs.writeFileSync('/tmp/more-qa.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            await browser.close();

            if (!url.endsWith('/more')) process.exit(2);
            if (htmlLang !== 'ar' || htmlDir !== 'rtl') process.exit(3);
            if (sectionCount !== 3 || listCount !== 3 || rowCount !== 9) process.exit(4);
            if (frameworkOverlayCount !== 0) process.exit(5);
            if (headings.join('|') !== 'العبادة|المجتمع|الحساب والتطبيق') process.exit(6);
            if (firstHref !== '/azkar' || !interactedUrl.endsWith('/azkar')) process.exit(7);
            if (relevantConsoleErrors.length !== 0) process.exit(8);
          })().catch(error => {
            console.error(error);
            process.exit(20);
          });
          EOF
          node /tmp/pw/more-qa.cjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: more-rendered-qa
          path: |
            /tmp/more-mobile.png
            /tmp/more-mobile-full.png
            /tmp/more-qa.json
            /tmp/prayerapp-prod.log
          if-no-files-found: warn
