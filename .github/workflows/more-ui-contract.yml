name: More UI Contract

on:
  pull_request:
    paths:
      - "app/more/**"
      - "components/more/**"
      - "components/ui/MosqueIcon.tsx"
      - "lib/i18n/**"
      - ".github/workflows/more-ui-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: More UI contract
        run: npx vitest run components/more/MorePageContract.test.tsx
      - name: Lint
        run: npm run lint
      - name: Test suite
        run: npm test
      - name: Production build
        run: npm run build
