name: More UI Contract

on:
  pull_request:
    paths:
      - "app/more/**"
      - "components/more/**"
      - "components/ui/MosqueIcon.tsx"
      - "lib/i18n/**"
      - ".github/workflows/more-ui-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Semantic groups
        run: npx vitest run components/more/MorePageContract.test.tsx -t "renders three semantic groups instead of one segmented list"
      - name: Row order and icons
        run: npx vitest run components/more/MorePageContract.test.tsx -t "keeps the approved row order and refined icon semantics"
      - name: Route-scoped styling
        run: npx vitest run components/more/MorePageContract.test.tsx -t "keeps More-specific visual polish isolated from shared public lists"
      - name: Localized section headings
        run: npx vitest run components/more/MorePageContract.test.tsx -t "localizes the three section headings for every supported locale"
