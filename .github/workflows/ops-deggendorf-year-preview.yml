name: One-time Deggendorf 365-day Adhan preview
on:
  push:
    branches:
      - ops/deggendorf-20261107-engine-preview
    paths:
      - .github/workflows/ops-deggendorf-year-preview.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact audited Prayerapp dependencies
        run: npm ci
      - name: Verify exact screenshot regression on real pinned Adhan
        run: npx vitest run lib/prayer-engine/deggendorf-reference-profile.test.ts
      - name: Calculate and print one-year production preview from Prayer Engine
        run: npx vitest run lib/prayer-engine/ops-deggendorf-one-year-preview.test.ts --reporter=verbose
