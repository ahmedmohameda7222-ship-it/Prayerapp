name: One-time publish corrected Android 1.0.0

on:
  push:
    branches:
      - ops/publish-android-v1.0.0
    paths:
      - .github/workflows/ops-publish-android-v1.0.0.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: one-time-publish-android-v1.0.0
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  SOURCE_RUN_ID: "32588543820"
  SOURCE_SHA: d86af5ffe2eecf5ac1c4a78cfe7d19ee572a1bc6
  MAIN_SHA: 18dd4a534731f2f2c3d6fbbfcdf6de5012c368a7
  EXPECTED_TREE: a592968ae1bdd638f388aca795ab7ef91dce1b8f
  RELEASE_TAG: android-v1.0.0
  EXPECTED_CERT_SHA256: E9:98:4B:DB:36:FF:2F:8F:A5:58:29:5C:5C:06:6F:BA:ED:3A:BD:BD:CC:80:1C:83:5D:AE:1B:DD:4C:D7:0E:92

jobs:
  preflight:
    name: Verify exact corrected source and current main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source run and tree identity
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.name' <<<"$run_json")" = "Android TWA"
          test "$(jq -r '.event' <<<"$run_json")" = "pull_request"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_SHA"
          source_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.commit.tree.sha')"
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          main_tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.commit.tree.sha')"
          test "$source_tree" = "$EXPECTED_TREE"
          test "$main_head" = "$MAIN_SHA"
          test "$main_tree" = "$EXPECTED_TREE"

      - name: Record publication run
        shell: bash
        run: |
          gh pr comment 47 --body "Android 1.0.0 corrected publication started from verified tree \`$EXPECTED_TREE\`. Source Android CI: \`$SOURCE_RUN_ID\`; current main: \`$MAIN_SHA\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish:
    name: Sign, verify, and publish corrected Android 1.0.0
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: android-production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Re-verify current main before signing
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.commit.tree.sha')" = "$EXPECTED_TREE"

      - name: Download exact corrected unsigned candidate
        uses: actions/download-artifact@v4
        with:
          name: danube-mosque-unsigned-candidate
          path: unsigned
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify unsigned candidate provenance and identity
        shell: bash
        run: |
          set -euo pipefail
          cd unsigned
          sha256sum --check SHA256SUMS.txt
          test "$(jq -r '.repository' source-metadata.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.sourceSha' source-metadata.json)" = "$SOURCE_SHA"
          test "$(jq -r '.pullRequest' source-metadata.json)" = "47"
          test "$(jq -r '.android.packageId' source-metadata.json)" = "de.donaumoschee.app"
          test "$(jq -r '.android.versionCode' source-metadata.json)" = "3"
          test "$(jq -r '.android.versionName' source-metadata.json)" = "1.0.0"
          test "$(jq -r '.android.targetSdkVersion' source-metadata.json)" = "36"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install signing and verification tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Reconstruct and verify permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test "$ANDROID_KEY_ALIAS" = "danube-mosque-release"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/danube-mosque-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          certificate="$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          actual="$(printf '%s\n' "$certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"

      - name: Sign corrected APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/danube-mosque-release.jks"
          mkdir signed
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 unsigned/danube-mosque-unsigned.apk signed/danube-mosque-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out signed/danube-mosque.apk \
            signed/danube-mosque-aligned.apk
          cp unsigned/danube-mosque-unsigned.aab signed/danube-mosque.aab
          jarsigner \
            -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -sigalg SHA384withRSA \
            -digestalg SHA-256 \
            signed/danube-mosque.aab "$ANDROID_KEY_ALIAS"
          rm -f signed/danube-mosque-aligned.apk

      - name: Independently verify signed package
        shell: bash
        run: |
          set -euo pipefail
          signature="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs signed/danube-mosque.apk)"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging signed/danube-mosque.apk)"
          printf '%s\n' "$badging" | grep -F "package: name='de.donaumoschee.app' versionCode='3' versionName='1.0.0'"
          printf '%s\n' "$badging" | grep -F "targetSdkVersion:'36'"
          jarsigner -verify -verbose -certs signed/danube-mosque.aab
          aab_certificate="$(keytool -printcert -jarfile signed/danube-mosque.aab)"
          aab_actual="$(printf '%s\n' "$aab_certificate" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test "$aab_actual" = "$EXPECTED_CERT_SHA256"
          unzip -t signed/danube-mosque.aab
          (cd signed && sha256sum danube-mosque.apk danube-mosque.aab > SHA256SUMS.txt)

      - name: Remove reconstructed signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/danube-mosque-release.jks"

      - name: Publish stable Android release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi
          gh release create "$RELEASE_TAG" \
            signed/danube-mosque.apk \
            signed/danube-mosque.aab \
            signed/SHA256SUMS.txt \
            --target "$MAIN_SHA" \
            --title "Danube Mosque Android 1.0.0" \
            --notes "Corrected production Android package de.donaumoschee.app, versionCode 3, versionName 1.0.0, targetSdk 36. Signed by the permanent production certificate."

      - name: Verify public release assets
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,targetCommitish,assets)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "false"
          jq -e '.assets | map(.name) | index("danube-mosque.apk") != null' <<<"$release_json" >/dev/null
          jq -e '.assets | map(.name) | index("danube-mosque.aab") != null' <<<"$release_json" >/dev/null
          jq -e '.assets | map(.name) | index("SHA256SUMS.txt") != null' <<<"$release_json" >/dev/null
          curl -fsSIL --retry 5 --retry-delay 2 "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/danube-mosque.apk" >/dev/null

  report:
    name: Report publication result
    if: always()
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record result on PR 47
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_RESULT" = "success" ] && [ "$PUBLISH_RESULT" = "success" ]; then
            gh pr comment 47 --body "Android 1.0.0 PUBLICATION READY ✅ — \`android-v1.0.0\` now contains the permanently signed \`danube-mosque.apk\` built from the corrected tree identical to current main. Package \`de.donaumoschee.app\`, versionCode \`3\`, versionName \`1.0.0\`, targetSdk \`36\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh pr comment 47 --body "Android 1.0.0 publication did not complete. preflight=\`$PREFLIGHT_RESULT\`, publish=\`$PUBLISH_RESULT\`. No readiness claim. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
