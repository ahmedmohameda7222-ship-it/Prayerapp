name: One-time Android 1.0.0 publication hold

on:
  push:
    branches:
      - ops/publish-android-v1.0.0
    paths:
      - .github/workflows/ops-publish-android-v1.0.0.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: one-time-publish-android-v1.0.0
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: android-v1.0.0

jobs:
  hold:
    name: Cancel publication and remove any raced release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove release if the previous run published before cancellation
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            echo "Removed $RELEASE_TAG because blocking P1 findings arrived before device QA."
          else
            echo "No public $RELEASE_TAG exists. Publication remains held."
          fi

      - name: Record hold on PR 46
        shell: bash
        run: |
          gh pr comment 46 --body "Android 1.0.0 publication is HELD after the post-merge Codex review surfaced blocking P1 native issues. Any raced \`android-v1.0.0\` release was removed by this hold workflow. Do not test the old APK as final; a corrected versionCode 3 build will be required after fixes."
