name: One-time Android 1.0.0 publication hold after follow-up review

on:
  push:
    branches:
      - ops/publish-android-v1.0.0
    paths:
      - .github/workflows/ops-publish-android-v1.0.0.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: one-time-publish-android-v1.0.0
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: android-v1.0.0

jobs:
  hold:
    name: Cancel publication and remove any raced release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove release if publication raced the P1 review
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
            echo "Removed $RELEASE_TAG because additional P1 findings arrived before device QA."
          else
            echo "No public $RELEASE_TAG exists. Publication remains held."
          fi

      - name: Record hold on PR 47
        shell: bash
        run: |
          gh pr comment 47 --body "Android 1.0.0 publication is HELD again. The post-merge Codex review on corrected head \`d86af5ffe2\` surfaced four additional P1 account/reset race issues. This hold run cancels the one-time publisher through the shared concurrency group and removes any raced \`android-v1.0.0\` release. Do not treat versionCode 3 as device-QA-ready until these findings are resolved and reverified. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
