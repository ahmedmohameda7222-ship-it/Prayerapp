name: Performance dependency ownership diagnostic

on:
  push:
    branches:
      - perf/admin-app-performance-hardening

permissions:
  contents: read

jobs:
  explain:
    if: "${{ github.event.head_commit.message == 'chore: trace remaining dependency advisories' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            masjid-display/package-lock.json
      - name: Explain root braces ownership
        run: |
          npm ci --ignore-scripts
          npm explain braces
      - name: Explain Masjid Display braces ownership
        working-directory: masjid-display
        run: |
          npm ci --ignore-scripts
          npm explain braces
