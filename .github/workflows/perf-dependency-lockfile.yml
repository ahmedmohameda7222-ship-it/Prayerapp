name: Performance dependency lockfile remediation

on:
  push:
    branches:
      - perf/admin-app-performance-hardening

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: "${{ github.event.head_commit.message == 'chore: generate hardened dependency lockfile' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate dependency lockfile with compatible security fixes
        run: |
          npm install next@16.3.6 eslint-config-next@16.3.6 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          git diff --check -- package.json package-lock.json
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes were generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: remediate npm dependency vulnerabilities'
          git push origin HEAD:perf/admin-app-performance-hardening
