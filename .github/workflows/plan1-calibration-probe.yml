name: Plan 1 Calibration Probe

on:
  push:
    branches: [feat/masjid-display]
    paths:
      - .github/workflows/plan1-calibration-probe.yml

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compare candidate explicit profiles to published Prayerapp rows
        run: |
          node <<'NODE'
          const {
            CalculationMethod,
            Coordinates,
            HighLatitudeRule,
            Madhab,
            PrayerTimes,
            Rounding,
          } = require('adhan');

          const LAT = 48.832595;
          const LON = 12.960072;
          const TZ = 'Europe/Berlin';
          const PRAYERS = ['fajr','sunrise','dhuhr','asr','maghrib','isha'];

          function ceilLocal(instant) {
            const rem = instant.getUTCSeconds() * 1000 + instant.getUTCMilliseconds();
            const rounded = rem === 0 ? instant : new Date(instant.getTime() + 60000 - rem);
            return new Intl.DateTimeFormat('en-GB', {
              timeZone: TZ,
              hour: '2-digit',
              minute: '2-digit',
              hourCycle: 'h23',
            }).format(rounded);
          }

          function minutes(value) {
            const [h,m] = value.split(':').map(Number);
            return h * 60 + m;
          }

          function signedClockDelta(expected, actual) {
            let d = minutes(expected) - minutes(actual);
            if (d > 720) d -= 1440;
            if (d < -720) d += 1440;
            return d;
          }

          function rawDay(date, { fajrAngle=18, ishaRule='angle', ishaAngle=17, ishaMinutes=90, asr=1, high='middle_of_night' } = {}) {
            const params = CalculationMethod.Other();
            params.fajrAngle = fajrAngle;
            params.ishaAngle = ishaRule === 'angle' ? ishaAngle : 0;
            params.ishaInterval = ishaRule === 'fixed_minutes' ? ishaMinutes : 0;
            params.madhab = asr === 2 ? Madhab.Hanafi : Madhab.Shafi;
            params.highLatitudeRule = {
              middle_of_night: HighLatitudeRule.MiddleOfTheNight,
              seventh_of_night: HighLatitudeRule.SeventhOfTheNight,
              twilight_angle: HighLatitudeRule.TwilightAngle,
            }[high];
            params.rounding = Rounding.None;
            const calc = new PrayerTimes(new Coordinates(LAT, LON), new Date(`${date}T12:00:00.000Z`), params);
            const out = {};
            for (const p of PRAYERS) {
              const instant = p === 'isha' && ishaRule === 'fixed_minutes' && ishaMinutes === 0
                ? calc.maghrib
                : calc[p];
              out[p] = ceilLocal(instant);
            }
            return out;
          }

          async function rows(from) {
            const response = await fetch(`https://donaumoschee.vercel.app/api/android/prayer-schedule?from=${from}&days=31`);
            if (!response.ok) throw new Error(`schedule fetch failed ${response.status}`);
            const body = await response.json();
            return body.rows || body.prayers || body.data || body;
          }

          function normalized(row) {
            return {
              date: row.date,
              fajr: row.fajr,
              sunrise: row.sunrise,
              dhuhr: row.dhuhr,
              asr: row.asr,
              maghrib: row.maghrib,
              isha: row.isha,
            };
          }

          function bestOffset(rows, prayer, calcForRow) {
            const deltas = rows.map((row) => signedClockDelta(row[prayer], calcForRow(row)[prayer]));
            let best = null;
            for (let offset = -60; offset <= 60; offset++) {
              const residuals = deltas.map((d) => d - offset);
              const max = Math.max(...residuals.map(Math.abs));
              const sum = residuals.reduce((a,b) => a + Math.abs(b), 0);
              if (!best || max < best.max || (max === best.max && sum < best.sum)) {
                best = { offset, max, sum, minDelta: Math.min(...deltas), maxDelta: Math.max(...deltas) };
              }
            }
            return best;
          }

          (async () => {
            const published = [
              ...(await rows('2026-09-01')),
              ...(await rows('2026-10-01')),
            ].map(normalized).filter((row, index, all) =>
              row.date && all.findIndex((candidate) => candidate.date === row.date) === index
            ).sort((a,b) => a.date.localeCompare(b.date));

            console.log(`PUBLISHED_ROWS=${published.length}`);
            console.log(`RANGE=${published[0]?.date}..${published.at(-1)?.date}`);

            const base = (row) => rawDay(row.date);
            for (const prayer of ['sunrise','dhuhr','maghrib']) {
              console.log(`CORE ${prayer}`, JSON.stringify(bestOffset(published, prayer, base)));
            }

            for (const asr of [1,2]) {
              const result = bestOffset(published, 'asr', (row) => rawDay(row.date, { asr }));
              console.log(`ASR factor=${asr}`, JSON.stringify(result));
            }

            const highs = ['middle_of_night','seventh_of_night','twilight_angle'];
            let bestFajr = [];
            for (const high of highs) {
              let best = null;
              for (let tenth = 1; tenth <= 300; tenth++) {
                const angle = tenth / 10;
                const result = bestOffset(published, 'fajr', (row) => rawDay(row.date, { fajrAngle: angle, high }));
                const candidate = { high, angle, ...result };
                if (!best || candidate.max < best.max || (candidate.max === best.max && candidate.sum < best.sum)) best = candidate;
              }
              bestFajr.push(best);
              console.log('FAJR_BEST', JSON.stringify(best));
            }

            for (const high of highs) {
              let bestAngle = null;
              for (let tenth = 1; tenth <= 300; tenth++) {
                const angle = tenth / 10;
                const result = bestOffset(published, 'isha', (row) => rawDay(row.date, { ishaRule:'angle', ishaAngle: angle, high }));
                const candidate = { rule:'angle', high, angle, ...result };
                if (!bestAngle || candidate.max < bestAngle.max || (candidate.max === bestAngle.max && candidate.sum < bestAngle.sum)) bestAngle = candidate;
              }
              console.log('ISHA_ANGLE_BEST', JSON.stringify(bestAngle));
            }

            let bestFixed = null;
            for (let interval = 0; interval <= 240; interval++) {
              const result = bestOffset(published, 'isha', (row) => rawDay(row.date, { ishaRule:'fixed_minutes', ishaMinutes: interval }));
              const candidate = { rule:'fixed_minutes', interval, ...result };
              if (!bestFixed || candidate.max < bestFixed.max || (candidate.max === bestFixed.max && candidate.sum < bestFixed.sum)) bestFixed = candidate;
            }
            console.log('ISHA_FIXED_BEST', JSON.stringify(bestFixed));

            const sampleDates = ['2026-09-15','2026-10-24','2026-10-25','2026-10-31'];
            console.log('REFERENCE_ROWS', JSON.stringify(published.filter((row) => sampleDates.includes(row.date))));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
