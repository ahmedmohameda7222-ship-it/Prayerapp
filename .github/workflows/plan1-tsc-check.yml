name: Plan 1 Standalone TypeScript Check

on:
  push:
    branches: [feat/masjid-display]
    paths:
      - .github/workflows/plan1-tsc-check.yml

permissions:
  contents: read

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
