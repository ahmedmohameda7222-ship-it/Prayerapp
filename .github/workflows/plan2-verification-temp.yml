name: Plan 2 Temporary Verification

on:
  push:
    branches:
      - feat/masjid-display

permissions:
  contents: read

jobs:
  verify-plan2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.116.0

      - name: Install dependencies
        run: npm ci

      - name: Run focused Plan 2 regressions
        run: >-
          npx vitest run
          app/admin/prayer-engine
          app/admin/prayer-times
          app/admin/masjid-display
          app/admin/masjid-display-test
          app/api/public/masjid-display-test-control
          lib/masjid-display
          lib/admin-jumuah-validation.test.ts
          lib/__tests__/admin-jumuah-ui-cleanup.test.ts

      - name: Run standalone TypeScript verification
        run: npx tsc --noEmit

      - name: Prove local Test Mode isolation and pre-feed independence
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT
          supabase db reset --local --no-seed
          supabase status -o env > /tmp/plan2-supabase.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/plan2-supabase.env
          set +a

          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"

          test -n "$DB_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"

          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.mosque_settings (
            id, mosque_name, address, phone, email, google_maps_link,
            whatsapp_link, telegram_link, account_holder, iban, bic, public_app_url
          ) values (
            '1', 'Local Plan 2 Test Mosque', 'Local test address', '', '', '',
            '', '', '', '', '', 'https://prayer.example.test/'
          )
          on conflict (id) do update set public_app_url = excluded.public_app_url;

          delete from public.prayer_settings;
          SQL

          snapshot() {
            psql "$DB_URL" -At -v ON_ERROR_STOP=1 <<'SQL'
          select 'prayer_times=' || count(*) || ':' || md5(coalesce(string_agg(to_jsonb(t)::text, '' order by to_jsonb(t)::text), '')) from public.prayer_times t;
          select 'announcements=' || count(*) || ':' || md5(coalesce(string_agg(to_jsonb(t)::text, '' order by to_jsonb(t)::text), '')) from public.announcements t;
          select 'events=' || count(*) || ':' || md5(coalesce(string_agg(to_jsonb(t)::text, '' order by to_jsonb(t)::text), '')) from public.events t;
          select 'donation_campaigns=' || count(*) || ':' || md5(coalesce(string_agg(to_jsonb(t)::text, '' order by to_jsonb(t)::text), '')) from public.donation_campaigns t;
          SQL
          }

          snapshot > /tmp/plan2-before.txt
          test "$(psql "$DB_URL" -Atc "select count(*) from public.prayer_settings")" = "0"

          cat > app/admin/masjid-display-test/local-runtime.temp.test.tsx <<'TEST'
          import { describe, expect, it, vi } from "vitest";

          const audit = vi.hoisted(() => ({
            begin: vi.fn(async () => ({ id: "local-plan2-audit" })),
            complete: vi.fn(async (_audit, result) => result),
          }));

          vi.mock("next/cache", () => ({ revalidatePath: vi.fn() }));
          vi.mock("@/lib/security/admin-audit", () => ({
            adminActionError: (error: unknown, fallback = "error") => error instanceof Error ? error.message : fallback,
            beginAdminAudit: audit.begin,
            completeAdminAudit: audit.complete,
          }));

          import { extendTestScenario, startTestScenario, stopTestScenario } from "./actions";
          import { GET } from "@/app/api/public/masjid-display-test-control/route";

          describe("Plan 2 local database Test Mode proof", () => {
            it("works without prayer_settings and mutates only the test-state path", async () => {
              const started = await startTestScenario("local-proof-token", "prayer_approaching");
              expect(started.success).toBe(true);
              expect(started.data?.expiresAt).toBeTruthy();

              const response = await GET();
              expect(response.status).toBe(200);
              expect(response.headers.get("Cache-Control")).toBe("no-store");
              await expect(response.json()).resolves.toMatchObject({
                active: true,
                scenario: "prayer_approaching",
                publicAppUrl: "https://prayer.example.test/",
                payload: { id: "test-prayer_approaching" },
              });

              const firstExpiry = new Date(started.data!.expiresAt!).getTime();
              const extended = await extendTestScenario("local-proof-token");
              expect(extended.success).toBe(true);
              expect(new Date(extended.data!.expiresAt!).getTime() - firstExpiry).toBe(15 * 60 * 1000);

              const stopped = await stopTestScenario("local-proof-token");
              expect(stopped).toMatchObject({ success: true, data: { enabled: false } });
              await expect((await GET()).json()).resolves.toEqual({ active: false });
            });
          });
          TEST

          npx vitest run app/admin/masjid-display-test/local-runtime.temp.test.tsx
          rm app/admin/masjid-display-test/local-runtime.temp.test.tsx

          snapshot > /tmp/plan2-after.txt
          diff -u /tmp/plan2-before.txt /tmp/plan2-after.txt

          test "$(psql "$DB_URL" -Atc "select count(*) from public.prayer_settings")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.masjid_display_test_state where id='1' and enabled=false")" = "1"
          echo "Plan 2 local Test Mode isolation: PASS"

      - name: Final legacy absolute-Iqama application grep
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nE '\b(fajr_iqama|dhuhr_iqama|asr_iqama|maghrib_iqama|isha_iqama)\b|fajrIqama|dhuhrIqama|asrIqama|maghribIqama|ishaIqama|getIqama\(' -- app components lib || true)"
          active="$(printf '%s\n' "$matches" | grep -vE '(^|/)__tests__/|\.test\.(ts|tsx):' || true)"
          if [ -n "$active" ]; then
            printf '%s\n' "$active"
            echo "Legacy absolute Iqama application/domain reference found" >&2
            exit 1
          fi
          echo "Legacy absolute Iqama application/domain grep: PASS"
