name: Plan 3 Temporary Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-plan3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - run: npm ci
      - name: Verify TypeScript directly
        run: npx tsc --noEmit
      - name: Verify Masjid Display HTTP runtime contract
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          app_pid=""
          cleanup() {
            if [ -n "$app_pid" ]; then kill "$app_pid" 2>/dev/null || true; fi
            supabase stop --no-backup >/dev/null 2>&1 || true
            cat /tmp/prayerapp-plan3-next.log 2>/dev/null || true
          }
          trap cleanup EXIT

          supabase db reset --local --no-seed
          supabase status -o env > /tmp/prayerapp-supabase.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/prayerapp-supabase.env
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"

          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.prayer_settings (
            id, latitude, longitude, timezone, fajr_angle, isha_rule, isha_angle,
            isha_minutes_after_maghrib, asr_shadow_factor, high_latitude_rule,
            fajr_offset_minutes, sunrise_offset_minutes, dhuhr_offset_minutes,
            asr_offset_minutes, maghrib_offset_minutes, isha_offset_minutes,
            fajr_iqama_delay_minutes, dhuhr_iqama_delay_minutes, asr_iqama_delay_minutes,
            maghrib_iqama_delay_minutes, isha_iqama_delay_minutes,
            calculation_revision, applied_calculation_revision, row_revision, updated_at
          ) values (
            '1', 48.0, 12.0, 'Europe/Berlin', 18, 'angle', 17,
            null, 1, 'middle_of_night',
            0, 0, 0, 0, 0, 0,
            20, 15, 15, 10, 15,
            1, 1, 1, '2026-09-15T00:00:00Z'
          )
          on conflict (id) do update set
            fajr_iqama_delay_minutes = excluded.fajr_iqama_delay_minutes,
            dhuhr_iqama_delay_minutes = excluded.dhuhr_iqama_delay_minutes,
            asr_iqama_delay_minutes = excluded.asr_iqama_delay_minutes,
            maghrib_iqama_delay_minutes = excluded.maghrib_iqama_delay_minutes,
            isha_iqama_delay_minutes = excluded.isha_iqama_delay_minutes,
            updated_at = excluded.updated_at;

          insert into public.masjid_display_settings (
            id, fajr_prayer_duration_minutes, dhuhr_prayer_duration_minutes,
            asr_prayer_duration_minutes, maghrib_prayer_duration_minutes,
            isha_prayer_duration_minutes, azkar_playlist_ids, updated_at
          ) values ('1', 10, 10, 10, 10, 10, '{}', '2026-09-15T00:00:00Z')
          on conflict (id) do update set
            fajr_prayer_duration_minutes = excluded.fajr_prayer_duration_minutes,
            dhuhr_prayer_duration_minutes = excluded.dhuhr_prayer_duration_minutes,
            asr_prayer_duration_minutes = excluded.asr_prayer_duration_minutes,
            maghrib_prayer_duration_minutes = excluded.maghrib_prayer_duration_minutes,
            isha_prayer_duration_minutes = excluded.isha_prayer_duration_minutes,
            azkar_playlist_ids = excluded.azkar_playlist_ids,
            updated_at = excluded.updated_at;

          insert into public.mosque_settings (
            id, mosque_name, mosque_name_ar, mosque_name_de, address, phone, email,
            google_maps_link, whatsapp_link, telegram_link, account_holder, iban, bic,
            public_app_url, updated_at
          ) values (
            '1', 'Synthetic Mosque', 'مسجد اختباري', 'Testmoschee', 'Teststraße 1',
            '', '', '', '', '', '', '', '', 'https://example.test', '2026-09-15T00:00:00Z'
          )
          on conflict (id) do update set
            mosque_name = excluded.mosque_name,
            mosque_name_ar = excluded.mosque_name_ar,
            mosque_name_de = excluded.mosque_name_de,
            address = excluded.address,
            public_app_url = excluded.public_app_url,
            updated_at = excluded.updated_at;

          delete from public.prayer_times;
          insert into public.prayer_times (
            date, fajr, sunrise, dhuhr, asr, maghrib, isha, published, updated_at
          )
          select
            day::date, '05:00', '06:30', '13:10', '16:45', '19:20', '20:45', true,
            '2026-09-15T00:00:00Z'::timestamptz
          from generate_series(
            (now() at time zone 'Europe/Berlin')::date - 1,
            (now() at time zone 'Europe/Berlin')::date + 35,
            interval '1 day'
          ) day;
          SQL

          npm run build
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/prayerapp-plan3-next.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Plan 3 runtime did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          curl --silent --show-error -D /tmp/feed-h1 -o /tmp/feed-b1 http://127.0.0.1:3000/api/public/masjid-display
          test "$(awk 'NR==1 {print $2}' /tmp/feed-h1)" = "200"
          etag1="$(awk 'tolower($1) == "etag:" {gsub("\\r", "", $2); print $2}' /tmp/feed-h1)"
          date1="$(awk 'tolower($1) == "date:" {$1=""; sub(/^ /, ""); gsub("\\r", ""); print}' /tmp/feed-h1)"
          test -n "$etag1"
          test -n "$date1"
          generated1="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/feed-b1","utf8")); process.stdout.write(j.generatedAt)')"
          revision1="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/feed-b1","utf8")); process.stdout.write(j.snapshotRevision)')"

          sleep 1
          curl --silent --show-error -D /tmp/feed-h2 -o /tmp/feed-b2 http://127.0.0.1:3000/api/public/masjid-display
          test "$(awk 'NR==1 {print $2}' /tmp/feed-h2)" = "200"
          etag2="$(awk 'tolower($1) == "etag:" {gsub("\\r", "", $2); print $2}' /tmp/feed-h2)"
          generated2="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/feed-b2","utf8")); process.stdout.write(j.generatedAt)')"
          revision2="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/feed-b2","utf8")); process.stdout.write(j.snapshotRevision)')"
          cmp /tmp/feed-b1 /tmp/feed-b2
          test "$etag2" = "$etag1"
          test "$generated2" = "$generated1"
          test "$revision2" = "$revision1"

          : > /tmp/feed-b3
          status3="$(curl --silent --show-error -D /tmp/feed-h3 -o /tmp/feed-b3 -w '%{http_code}' -H "If-None-Match: $etag1" http://127.0.0.1:3000/api/public/masjid-display)"
          test "$status3" = "304"
          test ! -s /tmp/feed-b3
          etag3="$(awk 'tolower($1) == "etag:" {gsub("\\r", "", $2); print $2}' /tmp/feed-h3)"
          date3="$(awk 'tolower($1) == "date:" {$1=""; sub(/^ /, ""); gsub("\\r", ""); print}' /tmp/feed-h3)"
          test "$etag3" = "$etag1"
          test -n "$date3"
