name: Qibla accessibility copy helper

on:
  push:
    branches:
      - feat/qibla-reliability-ux-hardening
    paths:
      - .github/workflows/qibla-a11y-copy-fix.yml
      - scripts/qibla-a11y-copy-fix.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qibla-reliability-ux-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/qibla-a11y-copy-fix.mjs
      - name: Commit accessibility and privacy copy
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/qibla/QiblaExperience.tsx messages/en.json messages/ar.json messages/de.json messages/tr.json
          git commit -m "fix: improve qibla accessibility semantics"
          git push origin HEAD:feat/qibla-reliability-ux-hardening
