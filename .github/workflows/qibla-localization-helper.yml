          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/en.json messages/ar.json messages/de.json messages/tr.json
          git commit -m "feat: localize hardened qibla experience"
          git push origin HEAD:feat/qibla-reliability-ux-hardening
