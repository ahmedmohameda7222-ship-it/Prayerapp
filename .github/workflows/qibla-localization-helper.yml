            tr: ' Kıble için kesin konumunuz bu cihazda yön ve manyetik düzeltme hesabında kullanılır; şehrinizi göstermek için yalnızca yaklaşık bir konum gönderilebilir. Pusula okumaları cihazda kalır.'
          };

          for (const locale of Object.keys(translations)) {
            const file = `messages/${locale}.json`;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.qibla = { ...data.qibla, ...translations[locale] };
            if (data.legal?.dataSummary && !data.legal.dataSummary.includes(legalAppend[locale].trim())) {
              data.legal.dataSummary += legalAppend[locale];
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
