            en: ' For Qibla, your precise location is used on this device to calculate the bearing and magnetic correction; only a coarse location may be sent to display your city. Compass readings remain on the device.',
            ar: ' بالنسبة للقبلة، يُستخدم موقعك الدقيق على هذا الجهاز لحساب الاتجاه وتصحيح الشمال المغناطيسي؛ وقد يُرسل موقع تقريبي فقط لعرض مدينتك. تبقى قراءات البوصلة على الجهاز.',
