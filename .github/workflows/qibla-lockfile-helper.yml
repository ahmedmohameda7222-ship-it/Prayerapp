name: Qibla lockfile helper

on:
  push:
    branches:
      - feat/qibla-reliability-ux-hardening
    paths:
      - .github/workflows/qibla-lockfile-helper.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qibla-reliability-ux-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate exact lockfile entry
        run: npm install geomagnetism@0.2.0 --save-exact --package-lock-only
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "feat: correct qibla compass to true north"
            git push origin HEAD:feat/qibla-reliability-ux-hardening
          fi
