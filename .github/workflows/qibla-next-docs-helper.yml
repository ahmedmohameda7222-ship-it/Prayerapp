name: Qibla Next docs helper

on:
  push:
    branches:
      - feat/qibla-reliability-ux-hardening
    paths:
      - .github/workflows/qibla-next-docs-helper.yml

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read repository-required Next.js 16 docs
        shell: bash
        run: |
          echo '=== Available route/client docs ==='
          find node_modules/next/dist/docs -type f \( -iname '*route*handler*' -o -iname '*client*component*' -o -iname '*browser*' \) -print | head -40
          echo '=== Route Handlers authority ==='
          ROUTE_DOC=$(find node_modules/next/dist/docs -type f -iname '*route*handler*' | head -1)
          test -n "$ROUTE_DOC"
          cat "$ROUTE_DOC"
          echo '=== Client/browser authority ==='
          CLIENT_DOC=$(find node_modules/next/dist/docs -type f -iname '*client*component*' | head -1)
          test -n "$CLIENT_DOC"
          cat "$CLIENT_DOC"
