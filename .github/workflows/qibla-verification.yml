name: Qibla verification helper

on:
  push:
    branches:
      - feat/qibla-reliability-ux-hardening
    paths:
      - .github/workflows/qibla-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Focused Qibla tests
        run: npm test -- qibla
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Full dependency audit
        run: npm audit
      - name: Service worker syntax
        run: node --check public/sw.js
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Geomagnetism dependency tree
        run: npm ls geomagnetism
      - name: Geomagnetism package metadata
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('node_modules/geomagnetism/package.json','utf8'));console.log({version:p.version,license:p.license,dependencies:p.dependencies||{}})"
