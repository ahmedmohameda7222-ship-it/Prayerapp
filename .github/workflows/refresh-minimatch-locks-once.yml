# Short-lived lockfile refresh for the @typescript-eslint minimatch override.
# Remove after run; this workflow never deploys, merges, or suppresses scans.
name: Refresh minimatch locks once
on:
  push:
    branches:
      - feature/deggendorf-reference-prayer-calibration
    paths:
      - .github/workflows/refresh-minimatch-locks-once.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'ahmedmohameda7222-ship-it/Prayerapp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          ref: feature/deggendorf-reference-prayer-calibration
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Re-resolve only transitive lockfiles with scoped minimatch overrides
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          (cd masjid-display && npm install --package-lock-only --ignore-scripts)
      - name: Check dependency graph, audit and lint in both applications
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev
          npm run lint
          npm test
          (cd masjid-display && npm ci && npm audit --omit=dev && npm run lint && npm test)
      - name: Commit lockfiles if checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          git add package-lock.json masjid-display/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lock changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'security: resolve vulnerable minimatch only for TypeScript-ESLint'
          # Header applies to this one git push only; no credentials persisted.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" push origin HEAD:refs/heads/feature/deggendorf-reference-prayer-calibration
