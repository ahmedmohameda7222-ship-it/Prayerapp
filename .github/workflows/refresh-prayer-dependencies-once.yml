# One-shot dependency lock regeneration for PR #112.
# No deployments, workflow bypasses, or security suppressions.
# Remove this workflow from the branch after it has run.
name: Regenerate vulnerable dependency locks once
on:
  push:
    branches:
      - feature/deggendorf-reference-prayer-calibration
    paths:
      - .github/workflows/refresh-prayer-dependencies-once.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'ahmedmohameda7222-ship-it/Prayerapp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: true
          ref: feature/deggendorf-reference-prayer-calibration
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Update exact Next.js, lint config and Vitest versions in both apps
        run: |
          set -euo pipefail
          for project in . masjid-display; do
            (
              cd "$project"
              npm install --package-lock-only --ignore-scripts --save-exact --save-prod next@16.4.5
              npm install --package-lock-only --ignore-scripts --save-exact --save-dev eslint-config-next@16.4.5 vitest@4.1.12
              npm audit fix --package-lock-only --ignore-scripts || echo 'Some transitive/development advisories remain; security scanners must still pass.'
            )
          done
      - name: Verify pinned installs and production dependency security
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev
          (cd masjid-display && npm ci && npm audit --omit=dev)
      - name: Commit updated manifests and locks only
        run: |
          set -euo pipefail
          git diff --check
          git add package.json package-lock.json masjid-display/package.json masjid-display/package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'security: upgrade Next.js and refresh vulnerable lockfiles in both apps'
          git push origin HEAD:refs/heads/feature/deggendorf-reference-prayer-calibration
