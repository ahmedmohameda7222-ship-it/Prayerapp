name: Refresh source-map-js lockfiles

on:
  push:
    branches: [perf/admin-app-performance-hardening]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/admin-app-performance-hardening
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Refresh root transitive lock
        run: npm update source-map-js --package-lock-only --ignore-scripts
      - name: Refresh Masjid Display transitive lock
        working-directory: masjid-display
        run: npm update source-map-js --package-lock-only --ignore-scripts
      - name: Verify manifests are unchanged and fixed version is locked
        run: |
          git diff --exit-code -- package.json masjid-display/package.json
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of ['package-lock.json', 'masjid-display/package-lock.json']) {
            const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
            const version = lock.packages?.['node_modules/source-map-js']?.version;
            if (version !== '1.2.2') throw new Error(`${path}: source-map-js=${version}`);
          }
          NODE
      - name: Commit lock-only remediation
        run: |
          test -n "$(git status --short -- package-lock.json masjid-display/package-lock.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json masjid-display/package-lock.json
          git commit -m "chore: lock source-map-js 1.2.2 [skip ci]"
          git push origin HEAD:perf/admin-app-performance-hardening
