name: Security Dependency Lock Refresh

on:
  push:
    branches:
      - security/prelaunch-remediation-2026-09-02
    paths:
      - ".github/workflows/security-dependency-refresh.yml"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  refresh-browserslist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/prelaunch-remediation-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
      - name: Refresh vulnerable transitive browserslist lock resolution
        run: npm update browserslist --package-lock-only
      - name: Verify vulnerable resolution is gone
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const pkg = lock.packages?.['node_modules/browserslist']
          if (!pkg?.version) throw new Error('browserslist lock entry missing')
          const [major, minor, patch] = pkg.version.split('.').map(Number)
          const fixed = major > 4 || (major === 4 && (minor > 28 || (minor === 28 && patch >= 7)))
          if (!fixed) throw new Error(`browserslist remains vulnerable: ${pkg.version}`)
          console.log(`browserslist=${pkg.version}`)
          NODE
      - name: Commit npm-generated lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already uses a fixed browserslist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh browserslist transitive dependency"
          git push origin HEAD:security/prelaunch-remediation-2026-09-02
