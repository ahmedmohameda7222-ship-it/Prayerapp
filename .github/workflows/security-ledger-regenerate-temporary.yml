name: Temporary security ledger regeneration

on:
  push:
    branches:
      - security/prelaunch-remediation-2026-09-02

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Regenerate ledger from approved matrix
        id: regenerate
        shell: bash
        run: |
          ledger='docs/security/prelaunch/2026-09-02/open-control-closure-ledger.json'
          old_sha="$(git rev-parse "HEAD:${ledger}")"
          node scripts/security/generate-open-control-closure-ledger.mjs
          if git diff --quiet -- "${ledger}"; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'changed=true' >> "${GITHUB_OUTPUT}"
          echo "old_sha=${old_sha}" >> "${GITHUB_OUTPUT}"
      - name: Commit regenerated ledger to remediation branch
        if: steps.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_SHA: ${{ steps.regenerate.outputs.old_sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          ledger='docs/security/prelaunch/2026-09-02/open-control-closure-ledger.json'
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const ledger = 'docs/security/prelaunch/2026-09-02/open-control-closure-ledger.json';
          const body = {
            message: 'fix(security): regenerate closure ledger owners',
            content: readFileSync(ledger).toString('base64'),
            sha: process.env.OLD_SHA,
            branch: process.env.BRANCH_NAME,
          };
          writeFileSync('/tmp/security-ledger-update.json', JSON.stringify(body));
          NODE
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${ledger}" \
            --input /tmp/security-ledger-update.json
