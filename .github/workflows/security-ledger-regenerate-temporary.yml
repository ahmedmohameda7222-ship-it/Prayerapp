name: Temporary security ledger verification

on:
  push:
    branches:
      - security/prelaunch-remediation-2026-09-02

permissions:
  contents: read

jobs:
  verify-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify generated ledger matches binding matrix
        run: node scripts/security/generate-open-control-closure-ledger.mjs --check
      - name: Run focused closure-ledger consistency tests
        run: npx vitest run lib/__tests__/security-open-control-ledger-consistency.test.ts
