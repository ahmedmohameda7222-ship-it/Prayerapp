name: Security Scanners

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4, pinned 2026-08-26
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4, pinned 2026-08-26
        with:
          category: "/language:javascript-typescript"

  secret-history-scan:
    name: Gitleaks full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository and reachable history with reviewed narrow allowlist
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact --verbose --exit-code 1 --config .gitleaks.toml --log-opts="--all" .

  dependency-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source dependency manifests and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src:ro" \
            ghcr.io/google/osv-scanner@sha256:bcb04b6bab5ab578898b3ff8b81b381e7961b1eac6aa87639b53aaea0d266003 \
            scan source --recursive /src

  sbom:
    name: Generate software-bill-of-materials evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate production npm CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p security-artifacts
          npm sbom --sbom-format=cyclonedx --omit=dev > security-artifacts/npm-production.cdx.json
          test -s security-artifacts/npm-production.cdx.json
          sha256sum security-artifacts/npm-production.cdx.json
      - name: Capture Android resolved dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-artifacts
          (
            cd android-twa
            ./gradlew --no-daemon --console=plain :app:dependencies
          ) > security-artifacts/android-gradle-dependencies.txt
          test -s security-artifacts/android-gradle-dependencies.txt
          sha256sum security-artifacts/android-gradle-dependencies.txt
      - name: Upload SBOM and Android dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prayerapp-security-sbom
          path: security-artifacts/
          if-no-files-found: error
          retention-days: 30

  exact-head-dast:
    name: Safe exact-head runtime DAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Build exact head
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Start isolated exact-head runtime and run safe DAST
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/prayerapp-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/prayerapp-next.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/privacy >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Exact-head runtime did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 EXPECT_STRICT_CSP=1 node scripts/security/safe-dast.mjs

  authenticated-dast:
    name: Safe authenticated local DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Run real local Auth flows and authenticated security probes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          supabase start
          app_pid=""
          cleanup() {
            if [ -n "$app_pid" ]; then kill "$app_pid" 2>/dev/null || true; fi
            supabase stop --no-backup >/dev/null 2>&1 || true
            cat /tmp/prayerapp-auth-dast-next.log 2>/dev/null || true
          }
          trap cleanup EXIT
          supabase db reset --local --no-seed
          supabase status -o env > /tmp/prayerapp-supabase.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/prayerapp-supabase.env
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"
          export ADMIN_EMAILS="security-admin-never-match@local.invalid"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          test -n "${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          npm run build
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/prayerapp-auth-dast-next.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Authenticated DAST runtime did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 node scripts/security/authenticated-dast.mjs

  production-dast:
    name: Safe deployed-production DAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Probe only non-destructive public/unauthorized boundaries
        env:
          BASE_URL: https://donaumoschee.vercel.app
          EXPECT_STRICT_CSP: "0"
        run: node scripts/security/safe-dast.mjs
