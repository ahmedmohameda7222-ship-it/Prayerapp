name: Temp Lock Refresh

on:
  pull_request:
    paths:
      - ".github/workflows/temp-lock-refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh vulnerable lockfile entries only
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify production audit
        run: npm audit --omit=dev
      - name: Verify full audit
        run: npm audit
      - name: Upload refreshed lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
