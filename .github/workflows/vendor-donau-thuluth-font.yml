name: Vendor Donau Thuluth font

on:
  push:
    branches:
      - feat/arabic-thuluth-mosque-name

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arabic-thuluth-mosque-name

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build renamed Thuluth subset and apply header styling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check fonttools brotli
          curl -fsSL \
            'https://raw.githubusercontent.com/53Abdeali/Travel_Itinerary/65e077da92ed146b6fa96ff3798b0d8bc381573b/travel-itinerary-frontend/src/components/Styles/LaylaThuluth%20Regular.ttf' \
            -o /tmp/layla-thuluth.ttf

          mkdir -p public/fonts
          pyftsubset /tmp/layla-thuluth.ttf \
            --text='مسجد الدوناو' \
            --layout-features='*' \
            --glyph-names \
            --symbol-cmap \
            --legacy-cmap \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs \
            --name-IDs='*' \
            --name-legacy \
            --name-languages='*' \
            --flavor=woff2 \
            --output-file=public/fonts/donau-thuluth.woff2

          python <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont

          font_path = Path('public/fonts/donau-thuluth.woff2')
          font = TTFont(font_path)
          name_table = font['name']
          replacements = {
              1: 'Donau Thuluth',
              2: 'Regular',
              3: 'Donau Thuluth Regular 1.0',
              4: 'Donau Thuluth Regular',
              6: 'DonauThuluth-Regular',
              16: 'Donau Thuluth',
              17: 'Regular',
          }
          name_table.names = [record for record in name_table.names if record.nameID not in replacements]
          for name_id, value in replacements.items():
              name_table.setName(value, name_id, 3, 1, 0x409)
              name_table.setName(value, name_id, 1, 0, 0)
          font.flavor = 'woff2'
          font.save(font_path)

          header_path = Path('components/layout/AppHeader.tsx')
          header = header_path.read_text()
          old = '            className={`${locale === "ar" ? "home-quran-text text-[32px] leading-[1.35]" : "text-[28px] leading-tight"} font-bold text-[#F2EBDD]`}\n'
          new = '''            className={\n              locale === "ar" && mosqueName === APP_NAMES.ar\n                ? "mosque-name-thuluth text-[40px] leading-[1.5] text-[#F2EBDD] sm:text-[42px]"\n                : "text-[28px] font-bold leading-tight text-[#F2EBDD]"\n            }\n'''
          if old not in header and 'mosque-name-thuluth' not in header:
              raise SystemExit('AppHeader target styling was not found')
          if old in header:
              header_path.write_text(header.replace(old, new, 1))

          css_path = Path('app/globals.css')
          css = css_path.read_text()
          font_face = '''\n@font-face {\n  font-family: "Donau Thuluth";\n  src: url("/fonts/donau-thuluth.woff2") format("woff2");\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n}\n'''
          if 'font-family: "Donau Thuluth"' not in css:
              marker = '@source "../app";\n'
              if marker not in css:
                  raise SystemExit('globals.css import marker was not found')
              css = css.replace(marker, marker + font_face, 1)

          thuluth_rule = '''\n.home-page-shell .mosque-name-thuluth {\n  font-family: "Donau Thuluth", "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;\n  font-weight: 400;\n  letter-spacing: 0;\n}\n'''
          if '.home-page-shell .mosque-name-thuluth' not in css:
              marker = '''.home-page-shell .home-quran-text,\n.home-page-shell .home-donation-verse {\n  font-family: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;\n}\n'''
              if marker not in css:
                  raise SystemExit('globals.css Quran typography marker was not found')
              css = css.replace(marker, marker + thuluth_rule, 1)
          css_path.write_text(css)
          PY

          test -s public/fonts/donau-thuluth.woff2
          size="$(stat -c%s public/fonts/donau-thuluth.woff2)"
          test "$size" -gt 3000
          test "$size" -lt 100000

      - name: Commit generated asset and implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fonts/donau-thuluth.woff2 app/globals.css components/layout/AppHeader.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: use Thuluth for Arabic mosque name'
          git push origin HEAD:feat/arabic-thuluth-mosque-name
