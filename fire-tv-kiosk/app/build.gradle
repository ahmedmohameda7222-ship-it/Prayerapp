plugins {
    id 'com.android.application'
}

android {
    namespace 'de.donaumoschee.firetv'
    compileSdk 37

    defaultConfig {
        applicationId 'de.donaumoschee.firetv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            // Sideloadable APK signed with the CI Android debug keystore.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
